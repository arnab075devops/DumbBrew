worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 10m;

  log_format main '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  # Razorpay's own servers call /api/payments/webhook, not a browser behind
  # a single client IP — a much looser zone than api_general/api_auth.
  limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=50r/s;
  # Seller applications/upload-url/login are unauthenticated writes (no
  # signed-in customer to blame a bad actor on) — much tighter than
  # api_auth's 5r/s.
  limit_req_zone $binary_remote_addr zone=api_seller_public:10m rate=5r/m;

  upstream auth_service {
    server auth-service:4001;
  }

  upstream content_service {
    server content-service:4002;
  }

  upstream order_service {
    server order-service:4003;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location /api/auth/login {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://auth_service;
      include proxy_params.conf;
    }

    location /api/auth {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://auth_service;
      include proxy_params.conf;
    }

    location /api/events {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://content_service;
      include proxy_params.conf;
    }

    location /api/newsletter {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://content_service;
      include proxy_params.conf;
    }

    location /api/customers {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://auth_service;
      include proxy_params.conf;
    }

    # More specific than /api/payments below — nginx matches the longest
    # prefix regardless of declaration order, so this always wins for
    # webhook requests. Must stay unauthenticated at this layer (no
    # limit_req burst tied to a customer's own rate) since Razorpay's
    # servers call it directly, verified by signature inside order-service.
    location /api/payments/webhook {
      limit_req zone=api_webhook burst=50 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/cart {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/addresses {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/orders {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/payments {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    # More specific than /api/sellers below — matches nginx's longest-prefix
    # rule regardless of declaration order. Unauthenticated (public
    # application form + its image upload + seller login), so a tighter,
    # separate rate zone than the signed-in-seller endpoints under
    # /api/sellers.
    location /api/sellers/applications {
      limit_req zone=api_seller_public burst=3 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/sellers/auth/login {
      limit_req zone=api_seller_public burst=3 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/sellers {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/admin/sellers {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/admin/reports {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/admin/visit-info {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/reviews {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location /api/reports {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://order_service;
      include proxy_params.conf;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
