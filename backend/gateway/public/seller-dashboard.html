<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Dashboard – DumbBrew</title>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:100px 24px 120px; }
.card { background:#faf5ea; border-radius:14px; padding:32px; box-shadow:0 2px 8px #24191008; margin-bottom:28px; }
h1 { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; margin:0 0 4px; color:#17100a; }
h2 { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; margin:0 0 16px; color:#17100a; }
.sub { font-size:13px; color:#5a412899; }
label { display:block; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#5a4128; margin-bottom:8px; margin-top:16px; }
label:first-of-type { margin-top:0; }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea, select { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #3b241422; border-radius:6px; background:#fff; font-size:14px; font-family:'Poppins',sans-serif; color:#241a10; outline:none; }
input:focus, textarea:focus { border-color:#c99a54; }
textarea { resize:vertical; min-height:70px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
button.primary { padding:13px 28px; background:#17100a; color:#f0e5d1; border:none; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; margin-top:18px; }
button.primary:disabled { opacity:0.5; cursor:default; }
button.link { background:none; border:none; color:#8a5527; font-size:13px; cursor:pointer; padding:0; font-weight:500; }
button.secondary { padding:9px 14px; background:#fff; color:#5a4128; border:1px solid #3b241422; border-radius:6px; font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; }
.product-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid #3b241418; font-size:14px; }
.product-row:first-child { border-top:none; }
.product-thumb { width:48px; height:48px; border-radius:6px; object-fit:cover; background:#3b241411; flex-shrink:0; }
.product-name { font-weight:600; }
.product-meta { font-size:12px; color:#5a412899; margin-top:2px; }
.product-price { font-family:'Playfair Display',serif; font-weight:700; color:#17100a; }
.pill { font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 9px; border-radius:10px; }
.pill.active { background:#7d8a4c22; color:#5a7d3c; }
.pill.inactive { background:#a13a2e22; color:#a13a2e; }
.pill.fulfilled { background:#7d8a4c22; color:#5a7d3c; }
.pill.unfulfilled { background:#c99a5422; color:#8a5527; }
.sale-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-top:1px solid #3b241418; font-size:14px; flex-wrap:wrap; }
.sale-row:first-child { border-top:none; }
.msg { font-size:13px; margin-top:14px; }
.msg.ok { color:#5a7d3c; }
.msg.err { color:#a13a2e; }
.variant-row { display:grid; grid-template-columns:2fr 1.2fr 1fr 1fr auto; gap:8px; margin-top:8px; align-items:center; }
.variant-row input { padding:9px 10px; font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.chip { font-size:12px; background:#3b241411; padding:5px 10px; border-radius:12px; }
.checkbox-row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; }
.checkbox-row input { width:auto; }
.remove-x { background:none; border:none; color:#a13a2e; cursor:pointer; font-size:16px; padding:0 6px; }
.collection-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #3b241418; font-size:14px; }
.collection-row:first-child { border-top:none; }
.tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
.tab-btn { padding:10px 18px; background:#faf5ea; border:1px solid #3b241422; border-radius:8px; font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#5a4128; cursor:pointer; }
.tab-btn.active { background:#17100a; color:#f0e5d1; border-color:#17100a; }
.tab-panel[hidden] { display:none; }
.notice-card { background:#a13a2e14; border:1px solid #a13a2e33; border-radius:14px; padding:20px 24px; margin-bottom:28px; }
.notice-row { padding:12px 0; border-top:1px solid #a13a2e22; }
.notice-row:first-child { border-top:none; padding-top:0; }
.notice-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.notice-title { font-weight:700; color:#a13a2e; font-size:12px; letter-spacing:0.5px; text-transform:uppercase; }
.notice-msg { font-size:14px; margin-top:6px; }
.notice-date { font-size:11px; color:#5a412899; margin-top:4px; }
.sales-controls { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.sales-controls .field label { margin:0 0 6px; }
.sales-controls input[type="date"] { width:auto; padding:10px 12px; }
.summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
.summary-tile { background:#3b241408; border-radius:10px; padding:16px; text-align:center; }
.summary-tile .num { font-family:'Playfair Display',serif; font-size:24px; font-weight:900; color:#17100a; }
.summary-tile .label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#5a4128; margin-top:4px; }
.chart-card { background:#faf5ea; border:1px solid #3b241418; border-radius:10px; padding:16px 18px 8px; margin-bottom:24px; }
.chart-title { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#5a4128; margin-bottom:10px; }
.chart-wrap { position:relative; height:220px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="./account.html" style="display:inline-block; margin-bottom:28px; font-size:13px; color:#8a5527; text-decoration:none;">&larr; Back to your account</a>
  <div id="content">Loading&hellip;</div>
</div>
<script>
(function () {
  const TOKEN_KEY = 'dumbbrew_seller_access_token';
  const contentEl = document.getElementById('content');
  let token = sessionStorage.getItem(TOKEN_KEY);

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Amounts are already rupee-denominated end to end (Razorpay orders are
  // created with currency:'INR', see order-service's lib/razorpay.ts) — this
  // was previously mislabeled with a $ prefix, not a currency conversion.
  function money(n) {
    return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function thumbUrl(key) { return key && window.assetUrl ? window.assetUrl(key) : null; }

  if (!token) {
    renderLogin();
  } else {
    checkSellerStatus();
  }

  function renderLogin(errorMsg) {
    contentEl.innerHTML =
      '<div class="card">' +
        '<h1>Seller Sign In</h1>' +
        '<div class="sub">Manage your DumbBrew storefront</div>' +
        '<label for="lf-email">Email</label><input type="email" id="lf-email"/>' +
        '<label for="lf-password">Password</label><input type="password" id="lf-password"/>' +
        '<button class="primary" id="btn-login">Sign In</button>' +
        '<div id="login-msg">' + (errorMsg ? '<div class="msg err">' + escapeHtml(errorMsg) + '</div>' : '') + '</div>' +
        '<p style="margin-top:18px;"><a href="./seller-apply.html" style="color:#8a5527; font-size:13px;">Haven\'t applied yet? Partner with us &rarr;</a></p>' +
      '</div>';

    document.getElementById('btn-login').addEventListener('click', function () {
      const email = document.getElementById('lf-email').value.trim();
      const password = document.getElementById('lf-password').value;
      const btn = document.getElementById('btn-login');
      const msgEl = document.getElementById('login-msg');
      btn.disabled = true;
      msgEl.innerHTML = '<div class="msg">Signing in&hellip;</div>';
      const { API_BASE } = window.APP_CONFIG;
      fetch(API_BASE + '/api/sellers/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
        .then(function (res) {
          if (!res.ok) {
            btn.disabled = false;
            msgEl.innerHTML = '<div class="msg err">Invalid credentials.</div>';
            return;
          }
          token = res.body.accessToken;
          sessionStorage.setItem(TOKEN_KEY, token);
          checkSellerStatus();
        })
        .catch(function () {
          btn.disabled = false;
          msgEl.innerHTML = '<div class="msg err">Could not sign in right now.</div>';
        });
    });
  }

  function api(path, init) {
    return window.orderApiRequest(path, init || {}, token).catch(function (err) {
      if (err && (err.status === 401 || err.status === 403)) {
        sessionStorage.removeItem(TOKEN_KEY);
        token = null;
        renderLogin('Your session expired — please sign in again.');
      }
      throw err;
    });
  }

  function checkSellerStatus() {
    contentEl.innerHTML = 'Loading&hellip;';
    api('/api/sellers/me', { method: 'GET' })
      .then(function (data) {
        if (!data.seller) {
          contentEl.innerHTML = '<div class="card"><div class="msg err">Could not load your seller status.</div></div>';
          return;
        }
        if (data.seller.must_reset_password) {
          renderForcedReset();
        } else {
          renderDashboard(data.seller);
        }
      })
      .catch(function () {});
  }

  function renderForcedReset() {
    contentEl.innerHTML =
      '<div class="card">' +
        '<h1>Set a New Password</h1>' +
        '<div class="sub">This is your first sign-in — choose a password only you know before continuing.</div>' +
        '<label for="rf-password">New password (min 8 characters)</label>' +
        '<input type="password" id="rf-password"/>' +
        '<button class="primary" id="btn-reset">Set Password</button>' +
        '<div id="reset-msg"></div>' +
      '</div>';
    document.getElementById('btn-reset').addEventListener('click', function () {
      const btn = document.getElementById('btn-reset');
      const msgEl = document.getElementById('reset-msg');
      const newPassword = document.getElementById('rf-password').value;
      if (newPassword.length < 8) {
        msgEl.innerHTML = '<div class="msg err">Password must be at least 8 characters.</div>';
        return;
      }
      btn.disabled = true;
      msgEl.innerHTML = '<div class="msg">Saving&hellip;</div>';
      api('/api/sellers/auth/reset-password', { method: 'POST', body: JSON.stringify({ newPassword: newPassword }) })
        .then(function () { checkSellerStatus(); })
        .catch(function () {
          btn.disabled = false;
          msgEl.innerHTML = '<div class="msg err">Could not set your password. Please try again.</div>';
        });
    });
  }

  // --- Dashboard ---

  let allCollections = [];
  let editingProductId = null;
  let variantRows = [];
  let pendingImages = []; // { imageKey, alt }

  function renderDashboard(seller) {
    contentEl.innerHTML =
      '<div class="card">' +
        '<div style="display:flex; align-items:center; justify-content:space-between;">' +
          '<div><h1>' + escapeHtml(seller.store_name) + '</h1><div class="sub">Seller dashboard</div></div>' +
          '<button class="link" id="btn-logout">Sign Out</button>' +
        '</div>' +
      '</div>' +
      '<div id="notices"></div>' +
      '<div class="tabs">' +
        '<button type="button" class="tab-btn active" data-tab="add">Add a Product</button>' +
        '<button type="button" class="tab-btn" data-tab="products">Your Products</button>' +
        '<button type="button" class="tab-btn" data-tab="collections">Collections</button>' +
        '<button type="button" class="tab-btn" data-tab="sales">Your Sales</button>' +
      '</div>' +
      '<div class="tab-panel" id="tab-add">' +
        '<div class="card" id="product-form-card"></div>' +
      '</div>' +
      '<div class="tab-panel" id="tab-products" hidden>' +
        '<div class="card">' +
          '<h2>Your Products</h2>' +
          '<div id="products">Loading&hellip;</div>' +
        '</div>' +
      '</div>' +
      '<div class="tab-panel" id="tab-collections" hidden>' +
        '<div class="card">' +
          '<h2>Collections</h2>' +
          '<label for="cf-title">New collection</label>' +
          '<div style="display:flex; gap:10px;"><input type="text" id="cf-title" placeholder="e.g. Single Origin"/><button class="secondary" id="btn-add-collection">Add</button></div>' +
          '<div id="collections">Loading&hellip;</div>' +
        '</div>' +
      '</div>' +
      '<div class="tab-panel" id="tab-sales" hidden>' +
        '<div class="card">' +
          '<h2>Your Sales</h2>' +
          '<div class="sub" style="margin-bottom:16px;">Paid orders only. Shows the current month by default — pick a fixed range below to see another window.</div>' +
          '<div class="sales-controls">' +
            '<div class="field"><label for="sf-from">From</label><input type="date" id="sf-from"/></div>' +
            '<div class="field"><label for="sf-to">To</label><input type="date" id="sf-to"/></div>' +
            '<button class="secondary" id="btn-apply-range">Apply</button>' +
            '<button class="link" id="btn-reset-range">This month</button>' +
          '</div>' +
          '<div id="sales-summary"></div>' +
          '<div class="chart-card" id="sales-chart-card" hidden>' +
            '<div class="chart-title">Revenue trend</div>' +
            '<div class="chart-wrap"><canvas id="sales-chart" height="220"></canvas></div>' +
          '</div>' +
          '<div id="sales">Loading&hellip;</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btn-logout').addEventListener('click', function () {
      sessionStorage.removeItem(TOKEN_KEY);
      token = null;
      renderLogin();
    });
    document.getElementById('btn-add-collection').addEventListener('click', addCollection);
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
    });
    document.getElementById('btn-apply-range').addEventListener('click', function () {
      const from = document.getElementById('sf-from').value;
      const to = document.getElementById('sf-to').value;
      loadSales(from || undefined, to || undefined);
    });
    document.getElementById('btn-reset-range').addEventListener('click', function () {
      document.getElementById('sf-from').value = '';
      document.getElementById('sf-to').value = '';
      loadSales();
    });

    resetProductForm();
    loadCollections();
    loadProducts();
    loadSales();
    loadNotices();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(function (panel) {
      panel.hidden = panel.id !== 'tab-' + tab;
    });
  }

  // --- Product form (add + edit share this) ---

  function resetProductForm() {
    editingProductId = null;
    variantRows = [];
    pendingImages = [];
    renderProductForm();
  }

  function renderProductForm(existing) {
    const card = document.getElementById('product-form-card');
    card.innerHTML =
      '<h2>' + (editingProductId ? 'Edit Product' : 'Add a Product') + '</h2>' +
      '<label for="pf-name">Name</label><input type="text" id="pf-name" value="' + escapeHtml(existing ? existing.name : '') + '"/>' +
      '<label for="pf-desc">Description</label><textarea id="pf-desc">' + escapeHtml(existing ? existing.description : '') + '</textarea>' +
      '<div class="two-col">' +
        '<div><label for="pf-price">Base price (₹)</label><input type="number" step="0.01" id="pf-price" value="' + (existing ? existing.price : '') + '"/><div class="sub">Used when there are no variants below.</div></div>' +
        '<div><label for="pf-category">Category</label><input type="text" id="pf-category" value="' + escapeHtml(existing ? (existing.category || '') : '') + '"/></div>' +
      '</div>' +
      '<label>Variants (optional — leave empty for a simple single-price product)</label>' +
      '<div id="variant-rows"></div>' +
      '<button type="button" class="secondary" id="btn-add-variant" style="margin-top:10px;">+ Add variant</button>' +
      '<label>Images</label>' +
      '<input type="file" id="pf-image-input" accept="image/png,image/jpeg,image/webp" multiple/>' +
      '<div class="chips" id="image-chips"></div>' +
      '<label>Collections</label>' +
      '<div id="collection-checks" class="sub">Loading&hellip;</div>' +
      '<div style="display:flex; gap:10px; align-items:center;">' +
        '<button class="primary" id="btn-save-product">' + (editingProductId ? 'Save Changes' : 'Add Product') + '</button>' +
        (editingProductId ? '<button type="button" class="link" id="btn-cancel-edit">Cancel</button>' : '') +
      '</div>' +
      '<div id="product-form-msg"></div>';

    renderVariantRows();
    renderImageChips();
    renderCollectionChecks(existing ? (existing.product_collections || []).map(function (pc) { return pc.collection_id; }) : []);

    document.getElementById('btn-add-variant').addEventListener('click', function () {
      variantRows.push({ title: '', sku: '', price: '', inventoryQuantity: '0' });
      renderVariantRows();
    });
    document.getElementById('pf-image-input').addEventListener('change', function (e) {
      Array.from(e.target.files).forEach(uploadProductImage);
      e.target.value = '';
    });
    document.getElementById('btn-save-product').addEventListener('click', saveProduct);
    if (editingProductId) {
      document.getElementById('btn-cancel-edit').addEventListener('click', resetProductForm);
    }
  }

  function renderVariantRows() {
    const el = document.getElementById('variant-rows');
    if (!el) return;
    el.innerHTML = variantRows.map(function (v, i) {
      return '<div class="variant-row" data-i="' + i + '">' +
        '<input type="text" placeholder="Title (e.g. 250g)" class="v-title" value="' + escapeHtml(v.title) + '"/>' +
        '<input type="text" placeholder="SKU" class="v-sku" value="' + escapeHtml(v.sku) + '"/>' +
        '<input type="number" step="0.01" placeholder="Price" class="v-price" value="' + escapeHtml(v.price) + '"/>' +
        '<input type="number" placeholder="Stock" class="v-qty" value="' + escapeHtml(v.inventoryQuantity) + '"/>' +
        '<button type="button" class="remove-x" data-remove="' + i + '">&times;</button>' +
      '</div>';
    }).join('');
    el.querySelectorAll('.variant-row').forEach(function (row) {
      const i = Number(row.dataset.i);
      row.querySelector('.v-title').addEventListener('input', function (e) { variantRows[i].title = e.target.value; });
      row.querySelector('.v-sku').addEventListener('input', function (e) { variantRows[i].sku = e.target.value; });
      row.querySelector('.v-price').addEventListener('input', function (e) { variantRows[i].price = e.target.value; });
      row.querySelector('.v-qty').addEventListener('input', function (e) { variantRows[i].inventoryQuantity = e.target.value; });
    });
    el.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        variantRows.splice(Number(btn.dataset.remove), 1);
        renderVariantRows();
      });
    });
  }

  function uploadProductImage(file) {
    const chipsEl = document.getElementById('image-chips');
    const placeholderId = 'up-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    chipsEl.insertAdjacentHTML('beforeend', '<span class="chip" id="' + placeholderId + '">Uploading&hellip;</span>');
    api('/api/sellers/uploads/presign', { method: 'POST', body: JSON.stringify({ fileName: file.name, contentType: file.type }) })
      .then(function (data) {
        return fetch(data.uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file })
          .then(function (r) {
            if (!r.ok) throw new Error('upload failed');
            pendingImages.push({ imageKey: data.imageKey, alt: file.name });
            renderImageChips();
          });
      })
      .catch(function () {
        const el = document.getElementById(placeholderId);
        if (el) el.textContent = 'Upload failed';
      });
  }

  function renderImageChips() {
    const el = document.getElementById('image-chips');
    if (!el) return;
    el.innerHTML = pendingImages.map(function (img, i) {
      return '<span class="chip">' + escapeHtml(img.alt || img.imageKey) + ' <button type="button" class="remove-x" data-rm-img="' + i + '">&times;</button></span>';
    }).join('');
    el.querySelectorAll('[data-rm-img]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        pendingImages.splice(Number(btn.dataset.rmImg), 1);
        renderImageChips();
      });
    });
  }

  function renderCollectionChecks(selectedIds) {
    const el = document.getElementById('collection-checks');
    if (!el) return;
    if (!allCollections.length) {
      el.innerHTML = '<div class="sub">No collections yet — add one below first, then it\'ll show up here.</div>';
      return;
    }
    el.innerHTML = allCollections.map(function (c) {
      const checked = selectedIds.indexOf(c.id) !== -1 ? ' checked' : '';
      return '<div class="checkbox-row"><input type="checkbox" class="coll-check" value="' + c.id + '"' + checked + '/><span>' + escapeHtml(c.title) + '</span></div>';
    }).join('');
  }

  function saveProduct() {
    const btn = document.getElementById('btn-save-product');
    const msgEl = document.getElementById('product-form-msg');
    const name = document.getElementById('pf-name').value.trim();
    const description = document.getElementById('pf-desc').value.trim();
    const price = Number(document.getElementById('pf-price').value);
    const category = document.getElementById('pf-category').value.trim();
    const collectionIds = Array.from(document.querySelectorAll('.coll-check:checked')).map(function (el) { return Number(el.value); });

    if (!name || !(price >= 0)) {
      msgEl.innerHTML = '<div class="msg err">Enter a name and a valid non-negative base price.</div>';
      return;
    }
    const variants = variantRows
      .filter(function (v) { return v.title.trim(); })
      .map(function (v, i) {
        return { title: v.title.trim(), sku: v.sku.trim() || undefined, price: Number(v.price) || 0, inventoryQuantity: Number(v.inventoryQuantity) || 0, position: i };
      });
    const images = pendingImages.map(function (img, i) { return { imageKey: img.imageKey, alt: img.alt, position: i }; });

    btn.disabled = true;
    msgEl.innerHTML = '<div class="msg">Saving&hellip;</div>';
    const payload = { name: name, description: description, price: price, category: category || undefined, variants: variants, images: images, collectionIds: collectionIds };
    if (images[0]) payload.imageKey = images[0].imageKey;

    const req = editingProductId
      ? api('/api/sellers/products/' + editingProductId, { method: 'PATCH', body: JSON.stringify(payload) })
      : api('/api/sellers/products', { method: 'POST', body: JSON.stringify(payload) });

    req
      .then(function () {
        resetProductForm();
        loadProducts();
      })
      .catch(function () {
        btn.disabled = false;
        msgEl.innerHTML = '<div class="msg err">Could not save that product.</div>';
      });
  }

  function editProduct(product) {
    editingProductId = product.id;
    variantRows = (product.product_variants || []).map(function (v) {
      return { title: v.title, sku: v.sku || '', price: String(v.price), inventoryQuantity: String(v.inventory_quantity) };
    });
    pendingImages = (product.product_images || []).map(function (img) { return { imageKey: img.image_key, alt: img.alt }; });
    renderProductForm(product);
    switchTab('add');
  }

  function loadProducts() {
    const el = document.getElementById('products');
    api('/api/sellers/products', { method: 'GET' })
      .then(function (data) {
        const products = data.products || [];
        if (!products.length) {
          el.innerHTML = '<div class="sub">No products yet — add one above.</div>';
          return;
        }
        el.innerHTML = products.map(function (p) {
          const variants = p.product_variants || [];
          const totalStock = variants.reduce(function (sum, v) { return sum + v.inventory_quantity; }, 0);
          const priceLabel = variants.length ? (variants.length + ' variant' + (variants.length > 1 ? 's' : '')) : money(p.price);
          const stockLabel = variants.length ? (totalStock + ' in stock') : 'untracked';
          const imgKey = (p.product_images && p.product_images[0] && p.product_images[0].image_key) || p.image_key;
          const thumb = thumbUrl(imgKey);
          return '<div class="product-row" data-id="' + p.id + '">' +
            (thumb ? '<img class="product-thumb" src="' + thumb + '"/>' : '<div class="product-thumb"></div>') +
            '<div style="flex:1;">' +
              '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
              '<div class="product-meta">' + escapeHtml(p.category || '') + ' &middot; ' + stockLabel + '</div>' +
            '</div>' +
            '<div class="product-price">' + priceLabel + '</div>' +
            '<span class="pill ' + (p.active ? 'active' : 'inactive') + '">' + (p.active ? 'Active' : 'Inactive') + '</span>' +
            '<button class="link" data-action="edit">Edit</button>' +
            '<button class="link" data-action="toggle">' + (p.active ? 'Deactivate' : 'Activate') + '</button>' +
          '</div>';
        }).join('');
        el.querySelectorAll('[data-action="edit"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = Number(btn.closest('.product-row').dataset.id);
            editProduct(products.find(function (p) { return p.id === id; }));
          });
        });
        el.querySelectorAll('[data-action="toggle"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = Number(btn.closest('.product-row').dataset.id);
            const product = products.find(function (p) { return p.id === id; });
            api('/api/sellers/products/' + id, { method: 'PATCH', body: JSON.stringify({ active: !product.active }) }).then(loadProducts);
          });
        });
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load your products right now.</div>';
      });
  }

  // --- Collections ---

  function loadCollections() {
    const el = document.getElementById('collections');
    api('/api/sellers/collections', { method: 'GET' })
      .then(function (data) {
        allCollections = data.collections || [];
        if (!allCollections.length) {
          el.innerHTML = '<div class="sub">No collections yet.</div>';
        } else {
          el.innerHTML = allCollections.map(function (c) {
            return '<div class="collection-row" data-id="' + c.id + '"><span>' + escapeHtml(c.title) + '</span><button class="link" data-del-collection>Delete</button></div>';
          }).join('');
          el.querySelectorAll('[data-del-collection]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const id = btn.closest('.collection-row').dataset.id;
              api('/api/sellers/collections/' + id, { method: 'DELETE' }).then(loadCollections);
            });
          });
        }
        const selected = editingProductId ? Array.from(document.querySelectorAll('.coll-check:checked')).map(function (e) { return Number(e.value); }) : [];
        renderCollectionChecks(selected);
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load collections right now.</div>';
      });
  }

  function addCollection() {
    const input = document.getElementById('cf-title');
    const title = input.value.trim();
    if (!title) return;
    api('/api/sellers/collections', { method: 'POST', body: JSON.stringify({ title: title }) })
      .then(function () {
        input.value = '';
        loadCollections();
      });
  }

  // --- Sales / fulfillment ---

  let currentSalesRange = { from: undefined, to: undefined };
  let salesChart = null;

  // One bar per calendar day the revenue landed on — the day is what a
  // seller picking a date range actually wants to see grow, not a raw list
  // of transactions re-plotted in the same order as the table below it.
  function renderSalesChart(sales) {
    const cardEl = document.getElementById('sales-chart-card');
    const canvas = document.getElementById('sales-chart');
    if (!cardEl || !canvas || typeof Chart === 'undefined') return;
    if (!sales.length) {
      cardEl.hidden = true;
      if (salesChart) { salesChart.destroy(); salesChart = null; }
      return;
    }
    cardEl.hidden = false;

    const byDay = new Map();
    sales.forEach(function (s) {
      const day = String(s.created_at).slice(0, 10); // YYYY-MM-DD
      byDay.set(day, (byDay.get(day) || 0) + Number(s.unit_price) * s.quantity);
    });
    const days = Array.from(byDay.keys()).sort();
    const labels = days.map(function (d) {
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    });
    const values = days.map(function (d) { return byDay.get(d); });

    if (salesChart) salesChart.destroy();
    salesChart = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Revenue',
          data: values,
          backgroundColor: '#b8722e',
          hoverBackgroundColor: '#96591f',
          borderRadius: 4,
          maxBarThickness: 36
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (ctx) { return money(ctx.parsed.y); } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#5a4128', font: { size: 11 } } },
          y: {
            beginAtZero: true,
            grid: { color: '#3b241412' },
            ticks: { color: '#5a4128', font: { size: 11 }, callback: function (v) { return money(v); } }
          }
        }
      }
    });
  }

  function loadSales(from, to) {
    currentSalesRange = { from: from, to: to };
    const el = document.getElementById('sales');
    const summaryEl = document.getElementById('sales-summary');
    const qs = [from ? 'from=' + encodeURIComponent(from) : '', to ? 'to=' + encodeURIComponent(to) : '']
      .filter(Boolean).join('&');
    api('/api/sellers/orders' + (qs ? '?' + qs : ''), { method: 'GET' })
      .then(function (data) {
        const sales = data.sales || [];
        const summary = data.summary || { revenue: 0, itemsSold: 0, orders: 0 };
        if (summaryEl) {
          summaryEl.innerHTML =
            '<div class="summary-grid">' +
              '<div class="summary-tile"><div class="num">' + money(summary.revenue) + '</div><div class="label">Revenue</div></div>' +
              '<div class="summary-tile"><div class="num">' + summary.orders + '</div><div class="label">Orders</div></div>' +
              '<div class="summary-tile"><div class="num">' + summary.itemsSold + '</div><div class="label">Items sold</div></div>' +
            '</div>';
        }
        renderSalesChart(sales);
        if (!sales.length) {
          el.innerHTML = '<div class="sub">No paid sales in this range.</div>';
          return;
        }
        el.innerHTML = sales.map(function (s) {
          const date = new Date(s.created_at);
          return '<div class="sale-row" data-id="' + s.order_item_id + '">' +
            '<span>' + s.quantity + '&times; ' + escapeHtml(s.product_name) + '</span>' +
            '<span>' + (isNaN(date.getTime()) ? '' : date.toLocaleDateString()) + '</span>' +
            '<span>' + money(Number(s.unit_price) * s.quantity) + '</span>' +
            '<span class="pill ' + (s.fulfillment_status || 'unfulfilled') + '">' + (s.fulfillment_status || 'unfulfilled') + '</span>' +
            (s.fulfillment_status !== 'fulfilled' ? '<button class="link" data-fulfill>Mark fulfilled</button>' : '') +
          '</div>';
        }).join('');
        el.querySelectorAll('[data-fulfill]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.closest('.sale-row').dataset.id;
            api('/api/sellers/orders/' + id + '/fulfill', { method: 'PATCH' })
              .then(function () { loadSales(currentSalesRange.from, currentSalesRange.to); });
          });
        });
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load your sales right now.</div>';
      });
  }

  // --- Notices (admin warnings) ---

  function loadNotices() {
    const el = document.getElementById('notices');
    if (!el) return;
    api('/api/sellers/notices', { method: 'GET' })
      .then(function (data) {
        const notices = (data.notices || []).filter(function (n) { return !n.acknowledged_at; });
        if (!notices.length) {
          el.innerHTML = '';
          return;
        }
        el.innerHTML =
          '<div class="notice-card">' +
            '<div class="notice-title">Notice from DumbBrew</div>' +
            notices.map(function (n) {
              const date = new Date(n.created_at);
              return '<div class="notice-row" data-id="' + n.id + '">' +
                '<div class="notice-head">' +
                  '<span class="notice-date">' + (isNaN(date.getTime()) ? '' : date.toLocaleDateString()) + '</span>' +
                  '<button class="link" data-ack>Dismiss</button>' +
                '</div>' +
                '<div class="notice-msg">' + escapeHtml(n.message) + '</div>' +
              '</div>';
            }).join('') +
          '</div>';
        el.querySelectorAll('[data-ack]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.closest('.notice-row').dataset.id;
            btn.disabled = true;
            api('/api/sellers/notices/' + id + '/ack', { method: 'PATCH' }).then(loadNotices);
          });
        });
      })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
