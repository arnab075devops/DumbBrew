<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
a { color:#8a5527; }
.site-nav { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(20px,4vw,72px); position:sticky; top:0; background:#f0e5d1b3; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #3b241414; z-index:20; color:#241a10; flex-wrap:wrap; gap:16px; }
.site-nav .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
.site-nav .brand img { width:40px; height:40px; object-fit:contain; display:block; }
.site-nav .brand-name { font-family:'Playfair Display',serif; font-weight:700; font-size:20px; letter-spacing:1px; color:#17100a; }
.site-nav .links { display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
.site-nav .links a { text-decoration:none; font-size:12.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease; }
.site-nav .links a:hover, .site-nav .links a.active { color:#8a5527; }
.icon-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid #3b241433; color:#3b2414cc; transition:color 0.3s ease, border-color 0.3s ease; flex:none; position:relative; text-decoration:none; background:none; cursor:pointer; padding:0; }
.icon-btn:hover { color:#8a5527; border-color:#8a552766; }
.page-head { background:#17100a; color:#f0e5d1; padding:64px clamp(20px,4vw,72px) 52px; }
.page-head .eyebrow { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#c99a54; font-weight:500; margin-bottom:14px; }
.page-head h1 { font-family:'Playfair Display',serif; font-size:clamp(28px,4vw,44px); font-weight:900; margin:0; letter-spacing:-1px; color:#f0e5d1; }
.page-head p { font-size:14px; color:#f0e5d1aa; margin:14px 0 0; font-weight:300; max-width:560px; line-height:1.7; }
.site-footer { background:#17100a; color:#f0e5d1; padding:48px clamp(20px,4vw,72px); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
.site-footer .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
.site-footer .brand img { width:28px; height:28px; object-fit:contain; display:block; }
.site-footer .brand span { font-family:'Playfair Display',serif; font-weight:700; font-size:15px; letter-spacing:1px; }
.site-footer .copy { font-size:11px; color:#f0e5d166; letter-spacing:0.5px; }
.site-footer .links { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.site-footer .links a { text-decoration:none; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa; }
.site-footer .partner { color:#f0e5d1; border:1px solid #f0e5d155; padding:8px 16px; border-radius:1px; letter-spacing:1.5px; }
.wrap { max-width:640px; margin:0 auto; padding:56px clamp(20px,4vw,40px) 120px; }
.card { background:#faf5ea; border-radius:14px; padding:32px; box-shadow:0 2px 8px #24191008; margin-bottom:28px; }
h2 { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; margin:0 0 16px; color:#17100a; }
.item-row { display:flex; align-items:center; gap:16px; padding:16px 0; border-top:1px solid #3b241418; }
.item-row:first-child { border-top:none; }
.item-img { width:56px; height:56px; border-radius:8px; object-fit:cover; background:#3b2414; flex:none; }
.item-icon { width:56px; height:56px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; background:#e7dac2; }
.item-icon svg { width:64%; height:64%; display:block; }
.item-info { flex:1; min-width:0; }
.item-name { font-weight:500; font-size:15px; }
.item-seller { font-size:12px; color:#5a412899; margin-top:2px; }
.qty-controls { display:flex; align-items:center; gap:10px; }
.qty-btn { width:26px; height:26px; border-radius:50%; border:1px solid #3b241433; background:#fff; cursor:pointer; font-size:15px; line-height:1; color:#241a10; }
.item-total { font-weight:600; min-width:70px; text-align:right; font-size:14px; }
.remove-btn { background:none; border:none; color:#a13a2e; font-size:12px; cursor:pointer; padding:0; margin-left:8px; }
.summary-row { display:flex; justify-content:space-between; padding:10px 0; font-size:15px; }
.summary-row.total { font-weight:700; font-size:18px; border-top:1px solid #3b241422; margin-top:6px; padding-top:16px; }
.address-option { display:flex; align-items:flex-start; gap:12px; padding:14px; border:1px solid #3b241422; border-radius:8px; margin-bottom:10px; cursor:pointer; }
.address-option.selected { border-color:#c99a54; background:#c99a5417; }
.address-option input { margin-top:3px; }
.address-lines { font-size:14px; line-height:1.5; }
.address-label { font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8a5527; }
label.field-label { display:block; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#5a4128; margin-bottom:8px; margin-top:16px; }
label.field-label:first-of-type { margin-top:0; }
.hint { font-size:12px; color:#5a412899; margin-top:6px; }
button.secondary { padding:10px 16px; background:#fff; color:#5a4128; border:1px solid #3b241422; border-radius:6px; font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; }
input[type="text"] { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #3b241422; border-radius:6px; background:#fff; font-size:14px; font-family:'Poppins',sans-serif; color:#241a10; outline:none; }
input[type="text"]:focus { border-color:#c99a54; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
button.link { background:none; border:none; color:#8a5527; font-size:13px; cursor:pointer; padding:0; font-weight:500; }
button.primary { width:100%; margin-top:24px; padding:16px; background:#17100a; color:#f0e5d1; border:none; border-radius:1px; font-weight:600; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
button.primary:disabled { opacity:0.5; cursor:default; }
.msg { font-size:13px; margin-top:14px; }
.msg.ok { color:#5a7d3c; }
.msg.err { color:#a13a2e; }
.empty { text-align:center; padding:40px 0; color:#5a412899; }
@media (max-width: 640px) {
  .site-nav { padding:14px 16px; }
  .page-head { padding:40px 16px 32px; }
  .wrap { padding:28px 16px 80px; }
  .site-footer { padding:32px 16px; flex-direction:column; text-align:center; }
  .card { padding:22px 18px; }
  .item-row { flex-wrap:wrap; }
  .item-info { flex:1 1 100%; order:1; }
  .item-img { order:0; }
  .qty-controls { order:2; }
  .item-total { order:3; margin-left:auto; }
  .remove-btn { order:4; }
  .two-col { grid-template-columns:1fr; }
}
</style>

<script src="./mobile-nav.js"></script>

        <span style="position:absolute; top:-3px; left:3px; width:8px; height:5px; border:1.5px solid currentColor; border-bottom:none; border-radius:3px 3px 0 0; box-sizing:border-box;"></span>

<div class="page-head">
  <div class="eyebrow">Checkout</div>
  <h1>Your Cart</h1>
</div>
<div class="wrap">
  <div id="content">Loading&hellip;</div>
</div>
<div class="site-footer">
  <a href="./index.html" class="brand">
    <img data-asset="db-logo.png" src="./assets/db-logo.png" alt="DumbBrew logo"/>
    <span>DumbBrew</span>
  </a>
  <div class="copy">&copy; 2026 DumbBrew Coffee &amp; Bakery. Made with love and too much caffeine.</div>
  <div class="links">
    <a href="./seller-apply.html" class="partner">Partner With Us</a>
    <a href="./terms.html">Terms</a>
    <a href="./data-policy.html">Data Policy</a>
  </div>
</div>
<script>
(function () {
  const accessToken = sessionStorage.getItem('dumbbrew_access_token');
  const contentEl = document.getElementById('content');
  if (!accessToken) {
    window.location.href = './login.html';
    return;
  }

  let cart = null;
  let addresses = [];
  let selectedAddressId = null;
  let showAddForm = false;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return window.formatINR(n); }

  // Same fallback icons as shop.html/wishlist.html — used whenever a listing
  // has no photo (image_key), instead of a broken/blank <img>. Kept in sync
  // with those copies; if you add a category there, add it here too.
  const GROUP_ICONS = {
    'Hot Coffee': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 28h24v10a12 12 0 0 1-12 12h0a12 12 0 0 1-12-12V28z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M40 30h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M22 16c0 2-3 3-3 6M29 16c0 2-3 3-3 6M36 16c0 2-3 3-3 6" fill="none" stroke="#c99a54" stroke-width="2" stroke-linecap="round"/></svg>',
    'Cold Drinks': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M20 20h24l-3 28a3 3 0 0 1-3 3H26a3 3 0 0 1-3-3L20 20z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M22 26h20" stroke="#5a4128" stroke-width="1.6" opacity="0.5"/><rect x="26" y="19" width="7" height="7" rx="1.5" fill="none" stroke="#c99a54" stroke-width="1.6" transform="rotate(20 29.5 22.5)"/><path d="M40 14l-4 38" stroke="#8a5527" stroke-width="2.2" stroke-linecap="round"/></svg>',
    'Smoothies & Juices': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M21 22h22l-2.5 26a3 3 0 0 1-3 2.7H26.5a3 3 0 0 1-3-2.7L21 22z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><circle cx="40" cy="20" r="6" fill="none" stroke="#c99a54" stroke-width="2"/><path d="M40 14v12M34 20h12" stroke="#c99a54" stroke-width="1.4"/><path d="M38 12l-2 40" stroke="#8a5527" stroke-width="2.2" stroke-linecap="round"/></svg>',
    'Hot Chocolate & Specialty': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 30h24v8a12 12 0 0 1-12 12h0a12 12 0 0 1-12-12v-8z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M40 32h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M18 30c2-4 4-4 6-8s4-4 6-8" fill="none" stroke="#c99a54" stroke-width="2.2" stroke-linecap="round"/><circle cx="30" cy="14" r="1.6" fill="#c99a54"/></svg>',
    'Tea': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 30h22v6a11 11 0 0 1-11 11h0a11 11 0 0 1-11-11v-6z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M38 32h4a4.5 4.5 0 0 1 0 9h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M27 30V18l6-4" fill="none" stroke="#c99a54" stroke-width="1.6"/><rect x="30" y="9" width="6" height="4.5" rx="1" fill="none" stroke="#c99a54" stroke-width="1.4"/></svg>'
  };
  const DEFAULT_ICON = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><ellipse cx="32" cy="32" rx="14" ry="20" fill="none" stroke="#5a4128" stroke-width="2.2" transform="rotate(20 32 32)"/><path d="M32 14c-4 8-4 28 0 36" fill="none" stroke="#5a4128" stroke-width="2" transform="rotate(20 32 32)"/></svg>';
  function iconFor(category) { return GROUP_ICONS[category] || DEFAULT_ICON; }

  Promise.all([
    window.orderApiRequest('/api/cart', { method: 'GET' }, accessToken),
    window.orderApiRequest('/api/addresses', { method: 'GET' }, accessToken)
  ])
    .then(function (results) {
      cart = results[0];
      addresses = results[1].addresses || [];
      const def = addresses.find(function (a) { return a.is_default; });
      selectedAddressId = def ? def.id : (addresses[0] ? addresses[0].id : null);
      render();
    })
    .catch(function (err) {
      contentEl.innerHTML = '<div class="card"><div class="msg err">Could not load your cart' +
        (err && err.status === 401 ? ' — please sign in again.' : '.') + '</div></div>';
    });

  function itemTotal(it) { return Number(it.products.price) * it.quantity; }
  function cartTotal() {
    return (cart.items || []).reduce(function (sum, it) {
      return it.products && it.products.active ? sum + itemTotal(it) : sum;
    }, 0);
  }

  function render() {
    const items = (cart.items || []).filter(function (it) { return it.products; });

    if (!items.length) {
      contentEl.innerHTML = '<div class="card empty">Your cart is empty.<br/><br/>' +
        '<a href="./brews.html" style="color:#8a5527;">Browse the menu &rarr;</a></div>';
      return;
    }

    contentEl.innerHTML =
      '<div class="card" id="items-card"></div>' +
      '<div class="card">' +
        '<h2>Deliver to</h2>' +
        '<div id="addresses"></div>' +
        '<button class="link" id="btn-toggle-address">' + (showAddForm ? 'Cancel' : '+ Add a new address') + '</button>' +
        '<div id="address-form"></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="summary-row total"><span>Total</span><span>' + money(cartTotal()) + '</span></div>' +
        '<button class="primary" id="btn-pay">Pay with Razorpay</button>' +
        '<div id="pay-msg"></div>' +
        '<div style="font-size:12px; color:#5a412888; margin-top:10px;">Prepaid only — payment is required to place an order.</div>' +
      '</div>';

    renderItems(items);
    renderAddresses();
    if (showAddForm) renderAddressForm();

    document.getElementById('btn-toggle-address').addEventListener('click', function () {
      showAddForm = !showAddForm;
      render();
    });
    document.getElementById('btn-pay').addEventListener('click', handlePay);
    updatePayButton();
  }

  function renderItems(items) {
    const el = document.getElementById('items-card');
    el.innerHTML = items.map(function (it) {
      const p = it.products;
      const inactive = !p.active;
      const mediaHtml = p.image_key
        ? '<img class="item-img" src="' + window.assetUrl(p.image_key) + '" alt=""/>'
        : '<div class="item-icon" aria-hidden="true">' + iconFor(p.category) + '</div>';
      return '<div class="item-row" data-item-id="' + it.id + '">' +
        mediaHtml +
        '<div class="item-info">' +
          '<div class="item-name">' + escapeHtml(p.name) + (inactive ? ' <span style="color:#a13a2e;">(no longer available)</span>' : '') + '</div>' +
          '<div class="item-seller">' + escapeHtml(p.sellers && p.sellers.store_name || '') + ' &middot; ' + money(p.price) + ' each</div>' +
        '</div>' +
        '<div class="qty-controls">' +
          '<button class="qty-btn" data-action="dec">&minus;</button>' +
          '<span>' + it.quantity + '</span>' +
          '<button class="qty-btn" data-action="inc">+</button>' +
        '</div>' +
        '<div class="item-total">' + money(itemTotal(it)) + '</div>' +
        '<button class="remove-btn" data-action="remove">Remove</button>' +
      '</div>';
    }).join('');

    el.querySelectorAll('.item-row').forEach(function (row) {
      const id = Number(row.dataset.itemId);
      const item = items.find(function (it) { return it.id === id; });
      row.querySelector('[data-action="inc"]').addEventListener('click', function () { changeQty(item, item.quantity + 1); });
      row.querySelector('[data-action="dec"]').addEventListener('click', function () { changeQty(item, item.quantity - 1); });
      row.querySelector('[data-action="remove"]').addEventListener('click', function () { changeQty(item, 0); });
    });
  }

  function changeQty(item, newQty) {
    window.orderApiRequest('/api/cart/items/' + item.id, {
      method: 'PATCH',
      body: JSON.stringify({ quantity: Math.max(0, newQty) })
    }, accessToken)
      .then(function () {
        return window.orderApiRequest('/api/cart', { method: 'GET' }, accessToken);
      })
      .then(function (fresh) { cart = fresh; render(); })
      .catch(function () {
        document.getElementById('pay-msg').innerHTML = '<div class="msg err">Could not update your cart.</div>';
      });
  }

  function renderAddresses() {
    const el = document.getElementById('addresses');
    if (!addresses.length) {
      el.innerHTML = '<div style="font-size:13px; color:#5a412899;">No saved addresses yet.</div>';
      return;
    }
    el.innerHTML = addresses.map(function (a) {
      return '<label class="address-option' + (a.id === selectedAddressId ? ' selected' : '') + '">' +
        '<input type="radio" name="address" value="' + a.id + '" ' + (a.id === selectedAddressId ? 'checked' : '') + '/>' +
        '<div class="address-lines">' +
          '<div class="address-label">' + escapeHtml(a.label) + '</div>' +
          escapeHtml(a.line1) + (a.line2 ? ', ' + escapeHtml(a.line2) : '') + '<br/>' +
          escapeHtml(a.city) + ', ' + escapeHtml(a.state) + ' ' + escapeHtml(a.pincode) + '<br/>' +
          escapeHtml(a.phone) +
        '</div>' +
      '</label>';
    }).join('');
    el.querySelectorAll('input[name="address"]').forEach(function (input) {
      input.addEventListener('change', function () {
        selectedAddressId = Number(input.value);
        render();
      });
    });
  }

  function renderAddressForm() {
    const el = document.getElementById('address-form');
    el.innerHTML =
      '<label class="field-label">Label</label><input type="text" id="af-label" value="Home"/>' +
      '<button type="button" class="secondary" id="btn-geo" style="margin-top:16px;">Use my location</button>' +
      '<div class="hint" id="geo-status"></div>' +
      '<label class="field-label">Address line 1</label><input type="text" id="af-line1"/>' +
      '<label class="field-label">Address line 2 (optional)</label><input type="text" id="af-line2"/>' +
      '<div class="two-col">' +
        '<div><label class="field-label">City</label><input type="text" id="af-city"/></div>' +
        '<div><label class="field-label">State</label><input type="text" id="af-state"/></div>' +
      '</div>' +
      '<div class="two-col">' +
        '<div><label class="field-label">PIN code</label><input type="text" id="af-pincode" maxlength="6"/></div>' +
        '<div><label class="field-label">Phone</label><input type="text" id="af-phone"/></div>' +
      '</div>' +
      '<button class="primary" id="btn-save-address" style="margin-top:20px;">Save Address</button>' +
      '<div id="address-form-msg"></div>';

    document.getElementById('btn-geo').addEventListener('click', function () {
      const statusEl = document.getElementById('geo-status');
      if (!navigator.geolocation) {
        statusEl.textContent = 'Location isn\'t available in this browser.';
        return;
      }
      statusEl.textContent = 'Getting your location…';
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          statusEl.textContent = 'Location captured — looking up your address…';
          fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng + '&addressdetails=1')
            .then(function (r) { return r.json(); })
            .then(function (data) {
              const addr = data && data.address ? data.address : {};
              const line1 = [addr.house_number, addr.road].filter(Boolean).join(' ') ||
                addr.neighbourhood || addr.suburb || '';
              const city = addr.city || addr.town || addr.village || addr.county || '';
              const state = addr.state || '';
              const pincode = addr.postcode || '';
              if (line1) document.getElementById('af-line1').value = line1;
              if (city) document.getElementById('af-city').value = city;
              if (state) document.getElementById('af-state').value = state;
              if (pincode) document.getElementById('af-pincode').value = pincode;
              statusEl.textContent = (line1 || city)
                ? 'Address filled in from your location — double-check it before saving.'
                : 'Location captured, but couldn\'t work out an address — please fill the fields in below.';
            })
            .catch(function () {
              statusEl.textContent = 'Location captured, but the address lookup failed — please fill the fields in below.';
            });
        },
        function () {
          statusEl.textContent = 'Could not get your location — your browser may have blocked it, or you can just fill the fields in below.';
        }
      );
    });

    document.getElementById('btn-save-address').addEventListener('click', function () {
      const payload = {
        label: document.getElementById('af-label').value.trim() || 'Home',
        line1: document.getElementById('af-line1').value.trim(),
        line2: document.getElementById('af-line2').value.trim(),
        city: document.getElementById('af-city').value.trim(),
        state: document.getElementById('af-state').value.trim(),
        pincode: document.getElementById('af-pincode').value.trim(),
        phone: document.getElementById('af-phone').value.trim(),
        isDefault: addresses.length === 0
      };
      const msgEl = document.getElementById('address-form-msg');
      if (!payload.line1 || !payload.city || !payload.state || !/^\d{6}$/.test(payload.pincode)) {
        msgEl.innerHTML = '<div class="msg err">Please fill in address line 1, city, state, and a 6-digit PIN code.</div>';
        return;
      }
      window.orderApiRequest('/api/addresses', { method: 'POST', body: JSON.stringify(payload) }, accessToken)
        .then(function (res) {
          addresses.push(res.address);
          selectedAddressId = res.address.id;
          showAddForm = false;
          render();
        })
        .catch(function () {
          msgEl.innerHTML = '<div class="msg err">Could not save that address.</div>';
        });
    });
  }

  function updatePayButton() {
    const btn = document.getElementById('btn-pay');
    if (!btn) return;
    btn.disabled = !selectedAddressId;
  }

  function handlePay() {
    const msgEl = document.getElementById('pay-msg');
    const btn = document.getElementById('btn-pay');
    if (!selectedAddressId) {
      msgEl.innerHTML = '<div class="msg err">Choose a delivery address first.</div>';
      return;
    }
    btn.disabled = true;
    msgEl.innerHTML = '<div class="msg">Starting checkout&hellip;</div>';

    window.orderApiRequest('/api/orders/checkout', {
      method: 'POST',
      body: JSON.stringify({ addressId: selectedAddressId })
    }, accessToken)
      .then(function (order) {
        if (typeof Razorpay === 'undefined') {
          msgEl.innerHTML = '<div class="msg err">Payment widget failed to load. Please refresh and try again.</div>';
          btn.disabled = false;
          return;
        }
        const rzp = new Razorpay({
          key: order.razorpayKeyId,
          order_id: order.razorpayOrderId,
          amount: Math.round(order.amount * 100),
          currency: 'INR',
          name: 'DumbBrew',
          description: 'Order #' + order.orderId,
          theme: { color: '#c99a54' },
          handler: function (response) {
            window.orderApiRequest('/api/payments/verify', {
              method: 'POST',
              body: JSON.stringify({
                razorpayOrderId: response.razorpay_order_id,
                razorpayPaymentId: response.razorpay_payment_id,
                razorpaySignature: response.razorpay_signature
              })
            }, accessToken)
              .then(function () {
                msgEl.innerHTML = '<div class="msg ok">Payment received — your order is confirmed. <a href="./account.html">View your orders</a></div>';
              })
              .catch(function () {
                msgEl.innerHTML = '<div class="msg ok">Payment received. It may take a moment to confirm — check <a href="./account.html">your orders</a> shortly.</div>';
              });
          },
          modal: {
            ondismiss: function () {
              btn.disabled = false;
              msgEl.innerHTML = '<div class="msg err">Checkout cancelled.</div>';
            }
          }
        });
        rzp.open();
      })
      .catch(function (err) {
        btn.disabled = false;
        msgEl.innerHTML = '<div class="msg err">' +
          (err && err.body && err.body.error === 'cart_empty' ? 'Your cart is empty.' : 'Could not start checkout. Please try again.') +
          '</div>';
      });
  }
})();
</script>
</body>
</html>
