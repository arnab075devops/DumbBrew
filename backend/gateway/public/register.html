<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account – DumbBrew</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="./config.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; background: #f0e5d1; overflow-x: hidden; }
a { color: #8a5527; }
a:hover { color: #7d8a4c; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
[data-reveal] { opacity: 0; transform: translateY(32px); will-change: transform, opacity; }
[data-nav] { transition: background-color 0.3s ease, box-shadow 0.3s ease; }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1 !important; transform: none !important; }
}
.field-input { width:100%; box-sizing:border-box; padding:14px 16px; border:1px solid #3b241433; background:#fffdf8; font-size:15px; font-family:'Poppins',sans-serif; font-weight:400; outline:none; color:#17100a; border-radius:2px; }
.field-input:focus { border-color:#c99a54; }
.field-label { display:block; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#5a4128; margin-bottom:8px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>

<div ref="{{ rootRef }}" style="font-family:'Poppins',sans-serif; background:#f0e5d1; color:#241a10; width:100%;">

  <!-- NAV -->
  <div data-nav="true" style="display:flex; align-items:center; justify-content:space-between; padding:20px 72px; position:sticky; top:0; background:#f0e5d1b3; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #3b241414; z-index:20; color:#241a10;">
    <a href="./index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
      <img src="{{ logoUrl }}" alt="DumbBrew logo" style="width:44px; height:44px; object-fit:contain; display:block;"/>
      <div style="font-family:'Playfair Display',serif; font-weight:700; font-size:22px; letter-spacing:1px; color:#17100a;">DumbBrew</div>
    </a>
    <div style="display:flex; gap:38px; align-items:center;">
      <a href="./brews.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Brews</a>
      <a href="./menu.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Menu</a>
      <a href="./story.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Story</a>
      <a href="./gallery.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Gallery</a>
      <a href="./shop.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Shop</a>
      <a href="./visit.html" style="text-decoration:none; font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease;" style-hover="color:#8a5527;">Visit</a>
      <a href="./login.html" aria-label="Account" style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid #3b241433; color:#3b2414cc; transition:color 0.3s ease, border-color 0.3s ease; flex:none;" style-hover="color:#8a5527; border-color:#8a552766;">
        <span style="position:relative; width:15px; height:15px; display:block;">
          <span style="position:absolute; top:0; left:3.5px; width:8px; height:8px; border-radius:50%; background:currentColor;"></span>
          <span style="position:absolute; bottom:-1px; left:0; width:15px; height:8px; border-radius:8px 8px 0 0; background:currentColor; overflow:hidden;"></span>
        </span>
      </a>
      <a href="./cart.html" aria-label="Cart" style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid #3b241433; color:#3b2414cc; transition:color 0.3s ease, border-color 0.3s ease; flex:none; position:relative;" style-hover="color:#8a5527; border-color:#8a552766;">
        <span style="position:relative; width:16px; height:14px; display:block;">
          <span style="position:absolute; top:0; left:1px; width:12px; height:8px; border:1.5px solid currentColor; border-top:none; border-radius:0 0 2px 2px; box-sizing:border-box;"></span>
          <span style="position:absolute; top:-3px; left:3px; width:8px; height:5px; border:1.5px solid currentColor; border-bottom:none; border-radius:3px 3px 0 0; box-sizing:border-box;"></span>
          <span style="position:absolute; bottom:-2px; left:2px; width:3px; height:3px; border-radius:50%; background:currentColor;"></span>
          <span style="position:absolute; bottom:-2px; right:2px; width:3px; height:3px; border-radius:50%; background:currentColor;"></span>
        </span>
      </a>
    </div>
  </div>

  <!-- HERO / FORM -->
  <div style="padding:100px 72px 160px;">
    <div style="max-width:560px; margin:0 auto;">
      <div data-reveal="true" style="text-align:center; margin-bottom:56px;">
        <div style="font-size:12px; letter-spacing:5px; text-transform:uppercase; color:#c99a54; font-weight:500; margin-bottom:20px;">Join Us</div>
        <h1 style="font-family:'Playfair Display',serif; font-size:clamp(34px,5vw,46px); font-weight:900; margin:0; color:#17100a; letter-spacing:-1px;">Create your account</h1>
      </div>

      <sc-if value="{{ status === 'success' }}">
        <div data-reveal="true" style="text-align:center; border-top:2px solid #7d8a4c; padding-top:32px;">
          <p style="font-size:17px; line-height:1.8; color:#5a4128; font-weight:300; margin:0 0 32px;">Account created. You can log in now.</p>
          <a href="./login.html" style="display:inline-block; padding:16px 40px; background:#c99a54; color:#17100a; text-decoration:none; border-radius:1px; font-weight:600; font-size:13px; letter-spacing:1.5px; text-transform:uppercase;">Log In</a>
        </div>
      </sc-if>

      <sc-if value="{{ status !== 'success' }}">
        <form data-reveal="true" onSubmit="{{ handleSubmit }}" style="display:flex; flex-direction:column; gap:22px;">
          <div>
            <label class="field-label" for="email">Email</label>
            <input class="field-input" id="email" type="email" required="true" disabled="{{ status === 'loading' }}"/>
          </div>
          <div>
            <label class="field-label" for="username">Username</label>
            <input class="field-input" id="username" type="text" pattern="[a-zA-Z0-9_]{3,24}" title="3-24 characters: letters, numbers, underscore only" required="true" disabled="{{ status === 'loading' }}"/>
          </div>
          <div>
            <label class="field-label" for="phone">Phone number</label>
            <div style="display:flex; gap:10px; align-items:center;">
              <span style="font-size:15px; color:#5a4128; font-weight:500; padding:14px 0;">+91</span>
              <input class="field-input" id="phone" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number" placeholder="98765 43210" required="true" disabled="{{ status === 'loading' }}"/>
            </div>
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <input class="field-input" id="password" type="password" minlength="8" required="true" disabled="{{ status === 'loading' }}"/>
          </div>
          <div>
            <label class="field-label" for="confirmPassword">Confirm password</label>
            <input class="field-input" id="confirmPassword" type="password" minlength="8" required="true" disabled="{{ status === 'loading' }}"/>
          </div>

          <label style="display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.7; color:#5a4128; font-weight:300; cursor:pointer; margin-top:8px;">
            <input type="checkbox" onChange="{{ handleTermsToggle }}" checked="{{ termsChecked }}" disabled="{{ status === 'loading' }}" style="margin-top:3px; width:16px; height:16px; accent-color:#c99a54; flex-shrink:0;"/>
            <span>I have read and accept the <a href="./terms.html" target="_blank" rel="noopener" style="color:#8a5527; font-weight:500;">Terms &amp; Conditions</a> and <a href="./data-policy.html" target="_blank" rel="noopener" style="color:#8a5527; font-weight:500;">Data Storage Policy</a>.</span>
          </label>

          <sc-if value="{{ status === 'error' }}">
            <div style="color:#a13a2e; font-size:14px; font-weight:500; padding:12px 16px; background:#a13a2e11; border-radius:2px;">{{ errorMessage }}</div>
          </sc-if>

          <button type="submit" disabled="{{ !canSubmit }}" style="margin-top:12px; padding:17px; background:#c99a54; color:#17100a; border:none; border-radius:1px; font-weight:600; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; transition:background 0.3s ease;" style-hover="background:#b3854a;">{{ submitLabel }}</button>

          <p style="text-align:center; font-size:13px; color:#5a412899; font-weight:300; margin:8px 0 0;">Already have an account? <a href="./login.html" style="color:#8a5527; font-weight:500;">Log in</a></p>
        </form>
      </sc-if>
    </div>
  </div>

  <!-- FOOTER -->
  <div style="background:#17100a; color:#f0e5d1; padding:64px 72px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:24px;">
    <a href="./index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
      <img src="{{ logoUrl }}" alt="DumbBrew logo" style="width:32px; height:32px; object-fit:contain; display:block;"/>
      <span style="font-family:'Playfair Display',serif; font-weight:700; font-size:17px; letter-spacing:1px;">DumbBrew</span>
    </a>
    <div style="font-size:12px; color:#f0e5d166; letter-spacing:0.5px;">&copy; 2026 DumbBrew Coffee &amp; Bakery. Made with love and too much caffeine.</div>
    <div style="display:flex; gap:28px;">
      <a href="./terms.html" style="text-decoration:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa;">Terms</a>
      <a href="./data-policy.html" style="text-decoration:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa;">Data Policy</a>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'idle', errorMessage: '', termsChecked: false };
  }
  componentDidMount() {
    this.reduceMotion = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.hasGsap = !!(window.gsap && window.ScrollTrigger);
    if (this.hasGsap) window.gsap.registerPlugin(window.ScrollTrigger);
    this.attachReveal();
    this.attachNavScroll();
  }
  componentDidUpdate() { this.attachReveal(); }
  attachReveal() {
    const root = this.rootNode || document;
    const els = Array.from(root.querySelectorAll('[data-reveal]')).filter(el => !el.dataset.revealBound);
    if (!els.length) { requestAnimationFrame(() => { if (!this._retried) { this._retried = true; this.attachReveal(); } }); return; }
    els.forEach((el) => { el.dataset.revealBound = '1'; });
    if (this.reduceMotion || !this.hasGsap) {
      els.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });
      return;
    }
    const gsap = window.gsap, ScrollTrigger = window.ScrollTrigger;
    this._triggers = this._triggers || [];
    ScrollTrigger.batch(els, {
      start: 'top 88%',
      once: true,
      onEnter: (batch) => { gsap.to(batch, { opacity: 1, y: 0, duration: 1, ease: 'power4.out', stagger: 0.08, overwrite: 'auto' }); }
    }).forEach((st) => this._triggers.push(st));
  }
  attachNavScroll() {
    if (!this.hasGsap) return;
    const root = this.rootNode || document;
    const nav = root.querySelector('[data-nav]');
    if (!nav) return;
    const gsap = window.gsap, ScrollTrigger = window.ScrollTrigger;
    this._triggers = this._triggers || [];
    const dur = this.reduceMotion ? 0 : 0.3;
    const st = ScrollTrigger.create({
      start: 'top -40',
      onEnter: () => gsap.to(nav, { backgroundColor: '#f0e5d1f0', boxShadow: '0 8px 30px #3b241422', duration: dur, ease: 'power1.out', overwrite: 'auto' }),
      onLeaveBack: () => gsap.to(nav, { backgroundColor: '#f0e5d1b3', boxShadow: '0 0 0 rgba(0,0,0,0)', duration: dur, ease: 'power1.out', overwrite: 'auto' })
    });
    this._triggers.push(st);
  }
  componentWillUnmount() {
    if (this._triggers) this._triggers.forEach((st) => st && st.kill && st.kill());
  }
  renderVals() {
    return {
      rootRef: (el) => { this.rootNode = el; },
      logoUrl: window.assetUrl('db-logo.png'),
      status: this.state.status,
      errorMessage: this.state.errorMessage,
      termsChecked: this.state.termsChecked,
      canSubmit: this.state.termsChecked && this.state.status !== 'loading',
      submitLabel: this.state.status === 'loading' ? 'Creating account…' : 'Create Account',
      handleTermsToggle: (e) => { this.setState({ termsChecked: e.target.checked }); },
      handleSubmit: (e) => {
        e.preventDefault();
        if (!this.state.termsChecked || this.state.status === 'loading') return;
        const form = e.target;
        const email = form.querySelector('#email').value.trim();
        const username = form.querySelector('#username').value.trim();
        const phone = form.querySelector('#phone').value.trim();
        const password = form.querySelector('#password').value;
        const confirmPassword = form.querySelector('#confirmPassword').value;
        if (password !== confirmPassword) {
          this.setState({ status: 'error', errorMessage: 'Passwords do not match.' });
          return;
        }
        this.setState({ status: 'loading', errorMessage: '' });
        fetch(window.APP_CONFIG.API_BASE + '/api/customers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email, username, phone, password,
            termsAccepted: true,
            termsVersion: window.APP_CONFIG.TERMS_VERSION
          })
        })
          .then((res) => res.json().catch(() => ({})).then((data) => ({ ok: res.ok, status: res.status, data })))
          .then(({ ok, status, data }) => {
            if (ok) { this.setState({ status: 'success' }); return; }
            if (status === 409) {
              const field = data && data.field;
              const label = field === 'email' ? 'email address' : field === 'username' ? 'username' : field === 'phone' ? 'phone number' : 'those details';
              this.setState({ status: 'error', errorMessage: 'An account with that ' + label + ' already exists.' });
              return;
            }
            this.setState({ status: 'error', errorMessage: 'Something went wrong. Please try again in a moment.' });
          })
          .catch(() => this.setState({ status: 'error', errorMessage: 'Something went wrong. Please try again in a moment.' }));
      }
    };
  }
}
</script>
</body>
</html>
