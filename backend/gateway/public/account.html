<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account – DumbBrew</title>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
.wrap { max-width:480px; margin:0 auto; padding:160px 24px; text-align:center; }
h1 { font-family:'Playfair Display',serif; font-size:38px; font-weight:900; margin:0 0 12px; color:#17100a; }
.field { display:flex; justify-content:space-between; border-top:1px solid #3b241422; padding:16px 0; font-size:15px; text-align:left; }
.field span:first-child { color:#5a4128; font-weight:500; }
button { margin-top:36px; padding:15px 40px; background:transparent; color:#a13a2e; border:1px solid #a13a2e55; border-radius:1px; font-weight:600; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
a.home { display:inline-block; margin-top:20px; font-size:13px; color:#8a5527; }
</style>
</head>
<body>
<div class="wrap">
  <div id="content">Loading&hellip;</div>
</div>
<script>
(function () {
  const accessToken = sessionStorage.getItem('dumbbrew_access_token');
  const contentEl = document.getElementById('content');
  if (!accessToken) {
    window.location.href = './login.html';
    return;
  }
  window.supabaseSelectAs('customers', 'select=username,email,phone_number&limit=1', accessToken)
    .then((rows) => {
      const me = rows && rows[0];
      if (!me) throw new Error('no profile row');
      contentEl.innerHTML =
        '<h1>Welcome, ' + escapeHtml(me.username) + '</h1>' +
        '<div class="field"><span>Email</span><span>' + escapeHtml(me.email) + '</span></div>' +
        '<div class="field"><span>Phone</span><span>' + escapeHtml(me.phone_number) + '</span></div>' +
        '<button id="logout">Log Out</button><br/>' +
        '<a class="home" href="./index.html">&larr; Back to DumbBrew</a>';
      document.getElementById('logout').addEventListener('click', function () {
        sessionStorage.removeItem('dumbbrew_access_token');
        window.location.href = './index.html';
      });
    })
    .catch(function () {
      // Most likely cause: the short-lived session token expired (no refresh
      // flow yet) — send back through login.html to get a fresh one.
      sessionStorage.removeItem('dumbbrew_access_token');
      window.location.href = './login.html';
    });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
