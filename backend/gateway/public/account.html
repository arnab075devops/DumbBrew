<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
a { color:#8a5527; }
.site-nav { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(20px,4vw,72px); position:sticky; top:0; background:#f0e5d1b3; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #3b241414; z-index:20; color:#241a10; flex-wrap:wrap; gap:16px; }
.site-nav .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
.site-nav .brand img { width:40px; height:40px; object-fit:contain; display:block; }
.site-nav .brand-name { font-family:'Playfair Display',serif; font-weight:700; font-size:20px; letter-spacing:1px; color:#17100a; }
.site-nav .links { display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
.site-nav .links a { text-decoration:none; font-size:12.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease; }
.site-nav .links a:hover, .site-nav .links a.active { color:#8a5527; }
.icon-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid #3b241433; color:#3b2414cc; transition:color 0.3s ease, border-color 0.3s ease; flex:none; position:relative; text-decoration:none; background:none; cursor:pointer; padding:0; }
.icon-btn:hover { color:#8a5527; border-color:#8a552766; }
.page-head { background:#17100a; color:#f0e5d1; padding:64px clamp(20px,4vw,72px) 52px; }
.page-head .eyebrow { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#c99a54; font-weight:500; margin-bottom:14px; }
.page-head h1 { font-family:'Playfair Display',serif; font-size:clamp(28px,4vw,44px); font-weight:900; margin:0; letter-spacing:-1px; color:#f0e5d1; }
.page-head p { font-size:14px; color:#f0e5d1aa; margin:14px 0 0; font-weight:300; max-width:560px; line-height:1.7; }
.site-footer { background:#17100a; color:#f0e5d1; padding:48px clamp(20px,4vw,72px); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
.site-footer .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
.site-footer .brand img { width:28px; height:28px; object-fit:contain; display:block; }
.site-footer .brand span { font-family:'Playfair Display',serif; font-weight:700; font-size:15px; letter-spacing:1px; }
.site-footer .copy { font-size:11px; color:#f0e5d166; letter-spacing:0.5px; }
.site-footer .links { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.site-footer .links a { text-decoration:none; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa; }
.site-footer .partner { color:#f0e5d1; border:1px solid #f0e5d155; padding:8px 16px; border-radius:1px; letter-spacing:1.5px; }
.wrap { max-width:560px; margin:0 auto; padding:56px clamp(20px,4vw,40px) 120px; }
.card { background:#faf5ea; border-radius:14px; padding:36px; box-shadow:0 2px 8px #24191008; margin-bottom:28px; }
.avatar { width:64px; height:64px; border-radius:50%; background:#8a5527; color:#f0e5d1; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:22px; font-weight:700; flex:none; }
h1 { font-family:'Playfair Display',serif; font-size:30px; font-weight:900; margin:0 0 4px; color:#17100a; }
.sub { font-size:13px; color:#5a412899; }
label { display:block; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#5a4128; margin-bottom:8px; margin-top:22px; }
label:first-of-type { margin-top:28px; }
input[type="text"] { width:100%; box-sizing:border-box; padding:13px 14px; border:1px solid #3b241422; border-radius:6px; background:#fff; font-size:15px; font-family:'Poppins',sans-serif; color:#241a10; outline:none; }
input[type="text"]:focus { border-color:#c99a54; }
.field-note { font-size:12px; color:#5a412888; margin-top:6px; }
.status-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.status-btn { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:8px; border:1px solid #3b241422; background:#fff; cursor:pointer; font-size:14px; font-family:'Poppins',sans-serif; color:#241a10; text-align:left; }
.status-btn.active { border-color:#c99a54; background:#c99a5417; font-weight:600; }
.status-emoji { font-size:18px; }
.actions { display:flex; align-items:center; gap:16px; margin-top:30px; }
button.primary { padding:15px 34px; background:#17100a; color:#f0e5d1; border:none; border-radius:1px; font-weight:600; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
button.primary:disabled { opacity:0.5; cursor:default; }
button.link { background:none; border:none; color:#a13a2e; font-size:13px; cursor:pointer; padding:0; }
.msg { font-size:13px; margin-top:16px; }
.msg.ok { color:#5a7d3c; }
.msg.err { color:#a13a2e; }
.directory-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid #3b241418; font-size:14px; }
.directory-row:first-child { border-top:none; }
.directory-name { font-weight:500; }
.directory-status { display:flex; align-items:center; gap:8px; color:#5a4128; }
.order-row { padding:16px 0; border-top:1px solid #3b241418; }
.order-row:first-child { border-top:none; }
.order-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.order-id { font-weight:600; font-size:14px; }
.order-date { font-size:12px; color:#5a412899; }
.order-status { font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 9px; border-radius:10px; }
.order-status.paid { background:#7d8a4c22; color:#5a7d3c; }
.order-status.created { background:#c99a5422; color:#8a5527; }
.order-status.failed { background:#a13a2e22; color:#a13a2e; }
.order-items { font-size:13px; color:#5a4128; margin-bottom:6px; }
.order-total { font-weight:700; text-align:right; font-size:14px; }
.order-item-line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; flex-wrap:wrap; }
.order-item-name { font-size:13px; color:#5a4128; }
.order-item-actions { display:flex; align-items:center; gap:10px; }
.stars { display:inline-flex; gap:2px; }
.stars button { background:none; border:none; padding:0; font-size:16px; cursor:pointer; color:#3b241433; }
.stars button.filled { color:#c99a54; }
.stars.readonly button { cursor:default; }
.report-link { font-size:12px; color:#a13a2e; background:none; border:none; cursor:pointer; padding:0; }
.report-form { margin-top:8px; padding:12px; background:#3b241408; border-radius:8px; }
.report-form textarea { min-height:60px; font-size:13px; }
.report-form .row { display:flex; gap:10px; margin-top:8px; }
.address-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid #3b241418; font-size:14px; }
.address-row:first-child { border-top:none; }
.address-lines { line-height:1.5; }
.address-label-tag { font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8a5527; }
.address-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none; }
.address-actions button { background:none; border:none; font-size:12px; cursor:pointer; padding:0; color:#8a5527; }
.address-actions button.danger { color:#a13a2e; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width: 640px) {
  .site-nav { padding:14px 16px; }
  .page-head { padding:40px 16px 32px; }
  .wrap { padding:28px 16px 80px; }
  .site-footer { padding:32px 16px; flex-direction:column; text-align:center; }
  .card { padding:22px 18px; }
  .two-col { grid-template-columns:1fr; }
  .directory-row, .order-head, .address-row { flex-wrap:wrap; }
  .address-row { flex-direction:column; }
  .address-actions { flex-direction:row; align-items:center; margin-top:8px; }
}
</style>

<script>
(function () {
  var STATUS_OPTIONS = [
    { key: 'busy', emoji: '🔴', label: 'Busy' },
    { key: 'out_of_office', emoji: '🌴', label: 'Out of Office' },
    { key: 'vacation', emoji: '🏖️', label: 'Vacation' },
    { key: 'vibing', emoji: '🎧', label: 'Vibing' },
    { key: 'feeling_hot', emoji: '🥵', label: 'Feeling Hot' },
    { key: 'focusing', emoji: '🎯', label: 'Focusing' },
    { key: 'working', emoji: '💻', label: 'Working' }
  ];
  var STATUS_BY_KEY = {};
  STATUS_OPTIONS.forEach(function (o) { STATUS_BY_KEY[o.key] = o; });

  var accessToken = sessionStorage.getItem('dumbbrew_access_token');
  var contentEl = document.getElementById('content');
  if (!accessToken) {
    window.location.href = './login.html';
    return;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return parts.slice(0, 2).map(function (s) { return s[0].toUpperCase(); }).join('');
  }

  function statusChip(key) {
    var opt = STATUS_BY_KEY[key];
    if (!opt) return '<span style="color:#5a412866;">No status set</span>';
    return '<span class="status-emoji">' + opt.emoji + '</span><span>' + escapeHtml(opt.label) + '</span>';
  }

  window.supabaseSelectAs('customers', 'select=id,username,email,phone_number,full_name,status&limit=1', accessToken)
    .then(function (rows) {
      var me = rows && rows[0];
      if (!me) throw new Error('no profile row');
      render(me);
    })
    .catch(function () {
      // Most likely cause: the short-lived session token expired (no refresh
      // flow yet) — send back through login.html to get a fresh one.
      sessionStorage.removeItem('dumbbrew_access_token');
      window.location.href = './login.html';
    });

  function render(me) {
    var selectedStatus = me.status || null;

    contentEl.innerHTML =
      '<div class="card">' +
        '<div style="display:flex; align-items:center; gap:18px;">' +
          '<div class="avatar">' + escapeHtml(initials(me.full_name || me.username)) + '</div>' +
          '<div>' +
            '<h1>' + escapeHtml(me.full_name || me.username) + '</h1>' +
            '<div class="sub">' + escapeHtml(me.email) + '</div>' +
          '</div>' +
        '</div>' +

        '<label for="fld-username">Username</label>' +
        '<input type="text" id="fld-username" value="' + escapeHtml(me.username) + '"/>' +
        '<div class="field-note">Letters, numbers, underscore, 3-24 characters.</div>' +

        '<label for="fld-fullname">Full Name</label>' +
        '<input type="text" id="fld-fullname" value="' + escapeHtml(me.full_name || '') + '" placeholder="Add your name"/>' +

        '<label>Status</label>' +
        '<div class="status-grid" id="status-grid"></div>' +

        '<div class="actions">' +
          '<button class="primary" id="btn-save">Save Changes</button>' +
          '<button class="link" id="btn-logout">Log Out</button>' +
        '</div>' +
        '<div id="save-msg"></div>' +
      '</div>' +

      '<div class="card">' +
        '<h1 style="font-size:20px;">Your Orders</h1>' +
        '<div id="orders">Loading&hellip;</div>' +
      '</div>' +

      '<div class="card">' +
        '<h1 style="font-size:20px;">Addresses</h1>' +
        '<div id="addresses">Loading&hellip;</div>' +
        '<button class="link" id="btn-toggle-address" style="margin-top:14px; color:#8a5527;">+ Add address</button>' +
        '<div id="address-form"></div>' +
      '</div>' +

      '<div class="card">' +
        '<h1 style="font-size:20px;">Right Now</h1>' +
        '<div class="sub" style="margin-bottom:8px;">Who\'s set a status</div>' +
        '<div id="directory">Loading&hellip;</div>' +
      '</div>' +

      '<div class="card" style="text-align:center;">' +
        '<div class="sub" style="margin-bottom:10px;">Have your own products to sell?</div>' +
        '<a href="./seller-apply.html" style="color:#8a5527; font-weight:600; font-size:13px; letter-spacing:0.5px; text-decoration:none;">Sell on DumbBrew &rarr;</a>' +
      '</div>';

    var grid = document.getElementById('status-grid');
    STATUS_OPTIONS.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'status-btn' + (opt.key === selectedStatus ? ' active' : '');
      btn.dataset.key = opt.key;
      btn.innerHTML = '<span class="status-emoji">' + opt.emoji + '</span><span>' + escapeHtml(opt.label) + '</span>';
      btn.addEventListener('click', function () {
        selectedStatus = (selectedStatus === opt.key) ? null : opt.key;
        Array.prototype.forEach.call(grid.querySelectorAll('.status-btn'), function (b) {
          b.classList.toggle('active', b.dataset.key === selectedStatus);
        });
      });
      grid.appendChild(btn);
    });

    document.getElementById('btn-logout').addEventListener('click', function () {
      sessionStorage.removeItem('dumbbrew_access_token');
      window.location.href = './index.html';
    });

    var saveBtn = document.getElementById('btn-save');
    var saveMsg = document.getElementById('save-msg');
    saveBtn.addEventListener('click', function () {
      var username = document.getElementById('fld-username').value.trim();
      var fullName = document.getElementById('fld-fullname').value.trim();
      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        saveMsg.className = 'msg err';
        saveMsg.textContent = 'Username must be 3-24 characters: letters, numbers, underscore only.';
        return;
      }
      saveBtn.disabled = true;
      saveMsg.className = 'msg';
      saveMsg.textContent = 'Saving…';
      window.supabaseUpdateAs('customers', 'id=eq.' + encodeURIComponent(me.id), {
        username: username,
        full_name: fullName || null,
        status: selectedStatus,
        status_updated_at: selectedStatus ? new Date().toISOString() : null
      }, accessToken)
        .then(function () {
          saveBtn.disabled = false;
          saveMsg.className = 'msg ok';
          saveMsg.textContent = 'Saved.';
          me.username = username;
          me.full_name = fullName || null;
          me.status = selectedStatus;
          loadDirectory(me);
        })
        .catch(function (err) {
          saveBtn.disabled = false;
          saveMsg.className = 'msg err';
          saveMsg.textContent = (err && err.status === 409)
            ? 'That username is already taken.'
            : 'Could not save changes. Please try again.';
        });
    });

    loadDirectory(me);
    loadOrders();
    setupAddresses();
  }

  function orderStatusLabel(status) {
    return { created: 'Awaiting payment', paid: 'Paid', failed: 'Payment failed' }[status] || status;
  }

  function starsHtml(itemId, rating, readonly) {
    var stars = [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button"' + (readonly ? ' disabled' : '') + ' data-star="' + n + '" class="' + (n <= rating ? 'filled' : '') + '">&#9733;</button>';
    }).join('');
    return '<span class="stars' + (readonly ? ' readonly' : '') + '" data-item-id="' + itemId + '">' + stars + '</span>';
  }

  function loadOrders() {
    var el = document.getElementById('orders');
    if (!el) return;
    window.orderApiRequest('/api/orders', { method: 'GET' }, accessToken)
      .then(function (data) {
        var orders = data.orders || [];
        if (!orders.length) {
          el.innerHTML = '<div class="sub">No orders yet — <a href="./shop.html" style="color:#8a5527;">start shopping</a>.</div>';
          return;
        }
        el.innerHTML = orders.map(function (o) {
          var isPaid = o.payment_status === 'paid';
          var itemsHtml = (o.order_items || []).map(function (it) {
            var name = it.products ? it.products.name : 'Item';
            // PostgREST embeds this as a single object, not an array —
            // product_reviews.order_item_id is unique, so it detects a
            // one-to-one relationship (unlike the one-to-many embeds above).
            var review = Array.isArray(it.product_reviews) ? it.product_reviews[0] : it.product_reviews;
            var ratingHtml = '';
            var reportHtml = '';
            if (isPaid) {
              ratingHtml = review
                ? starsHtml(it.id, review.rating, true)
                : starsHtml(it.id, 0, false);
              reportHtml = '<button type="button" class="report-link" data-report-item="' + it.id + '" data-seller-id="' + escapeHtml(it.seller_id || '') + '">Report seller</button>';
            }
            return '<div class="order-item-line" data-order-item-id="' + it.id + '">' +
              '<span class="order-item-name">' + it.quantity + '&times; ' + escapeHtml(name) + '</span>' +
              '<span class="order-item-actions">' + ratingHtml + reportHtml + '</span>' +
            '</div>' +
            '<div class="report-slot" data-report-slot="' + it.id + '"></div>';
          }).join('');
          var date = new Date(o.created_at);
          return '<div class="order-row">' +
            '<div class="order-head">' +
              '<span class="order-id">Order #' + o.id + '</span>' +
              '<span class="order-status ' + escapeHtml(o.payment_status) + '">' + escapeHtml(orderStatusLabel(o.payment_status)) + '</span>' +
            '</div>' +
            '<div class="order-date">' + (isNaN(date.getTime()) ? '' : date.toLocaleDateString()) + '</div>' +
            '<div class="order-items">' + itemsHtml + '</div>' +
            '<div class="order-total">' + window.formatINR(o.amount) + '</div>' +
          '</div>';
        }).join('');

        el.querySelectorAll('.stars:not(.readonly)').forEach(function (starEl) {
          starEl.querySelectorAll('button').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var itemId = Number(starEl.dataset.itemId);
              var rating = Number(btn.dataset.star);
              window.orderApiRequest('/api/reviews', {
                method: 'POST',
                body: JSON.stringify({ orderItemId: itemId, rating: rating })
              }, accessToken)
                .then(loadOrders)
                .catch(function () { /* leave the widget as-is; the user can retry */ });
            });
          });
        });

        el.querySelectorAll('[data-report-item]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var itemId = btn.dataset.reportItem;
            var sellerId = btn.dataset.sellerId;
            var slot = el.querySelector('[data-report-slot="' + itemId + '"]');
            if (!slot) return;
            if (slot.innerHTML) { slot.innerHTML = ''; return; }
            slot.innerHTML =
              '<div class="report-form">' +
                '<label style="margin-top:0;">Report this seller</label>' +
                '<textarea placeholder="What went wrong?"></textarea>' +
                '<div class="row">' +
                  '<button class="secondary" type="button" data-submit-report>Submit</button>' +
                  '<button class="link" type="button" data-cancel-report>Cancel</button>' +
                '</div>' +
                '<div class="msg" data-report-msg></div>' +
              '</div>';
            slot.querySelector('[data-cancel-report]').addEventListener('click', function () { slot.innerHTML = ''; });
            slot.querySelector('[data-submit-report]').addEventListener('click', function () {
              var textarea = slot.querySelector('textarea');
              var reason = textarea.value.trim();
              var msgEl = slot.querySelector('[data-report-msg]');
              if (reason.length < 10) {
                msgEl.className = 'msg err';
                msgEl.textContent = 'Please describe the issue in at least 10 characters.';
                return;
              }
              window.orderApiRequest('/api/reports', {
                method: 'POST',
                body: JSON.stringify({ sellerId: sellerId, orderItemId: Number(itemId), reason: reason })
              }, accessToken)
                .then(function () {
                  slot.innerHTML = '<div class="msg ok">Thanks — our team will review this.</div>';
                })
                .catch(function () {
                  msgEl.className = 'msg err';
                  msgEl.textContent = 'Could not submit your report right now.';
                });
            });
          });
        });
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load your orders right now.</div>';
      });
  }

  var addresses = [];
  var showAddressForm = false;

  function setupAddresses() {
    loadAddresses();
    document.getElementById('btn-toggle-address').addEventListener('click', function () {
      showAddressForm = !showAddressForm;
      renderAddressForm();
    });
  }

  function loadAddresses() {
    var el = document.getElementById('addresses');
    window.orderApiRequest('/api/addresses', { method: 'GET' }, accessToken)
      .then(function (data) {
        addresses = data.addresses || [];
        renderAddresses();
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load your addresses right now.</div>';
      });
  }

  function renderAddresses() {
    var el = document.getElementById('addresses');
    if (!addresses.length) {
      el.innerHTML = '<div class="sub">No saved addresses yet.</div>';
      return;
    }
    el.innerHTML = addresses.map(function (a) {
      return '<div class="address-row" data-id="' + a.id + '">' +
        '<div class="address-lines">' +
          '<div class="address-label-tag">' + escapeHtml(a.label) + (a.is_default ? ' &middot; Default' : '') + '</div>' +
          escapeHtml(a.line1) + (a.line2 ? ', ' + escapeHtml(a.line2) : '') + '<br/>' +
          escapeHtml(a.city) + ', ' + escapeHtml(a.state) + ' ' + escapeHtml(a.pincode) + '<br/>' +
          escapeHtml(a.phone) +
        '</div>' +
        '<div class="address-actions">' +
          (a.is_default ? '' : '<button data-action="default">Set default</button>') +
          '<button class="danger" data-action="delete">Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');

    el.querySelectorAll('.address-row').forEach(function (row) {
      var id = Number(row.dataset.id);
      var defaultBtn = row.querySelector('[data-action="default"]');
      if (defaultBtn) defaultBtn.addEventListener('click', function () {
        window.orderApiRequest('/api/addresses/' + id, { method: 'PATCH', body: JSON.stringify({ isDefault: true }) }, accessToken)
          .then(loadAddresses);
      });
      row.querySelector('[data-action="delete"]').addEventListener('click', function () {
        window.orderApiRequest('/api/addresses/' + id, { method: 'DELETE' }, accessToken)
          .then(loadAddresses);
      });
    });
  }

  function renderAddressForm() {
    var el = document.getElementById('address-form');
    var toggleBtn = document.getElementById('btn-toggle-address');
    toggleBtn.textContent = showAddressForm ? 'Cancel' : '+ Add address';
    if (!showAddressForm) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<label class="field-label" style="margin-top:16px;">Label</label><input type="text" id="af-label" value="Home"/>' +
      '<label class="field-label">Address line 1</label><input type="text" id="af-line1"/>' +
      '<label class="field-label">Address line 2 (optional)</label><input type="text" id="af-line2"/>' +
      '<div class="two-col">' +
        '<div><label class="field-label">City</label><input type="text" id="af-city"/></div>' +
        '<div><label class="field-label">State</label><input type="text" id="af-state"/></div>' +
      '</div>' +
      '<div class="two-col">' +
        '<div><label class="field-label">PIN code</label><input type="text" id="af-pincode" maxlength="6"/></div>' +
        '<div><label class="field-label">Phone</label><input type="text" id="af-phone"/></div>' +
      '</div>' +
      '<button class="primary" id="btn-save-address" style="margin-top:20px;">Save Address</button>' +
      '<div id="address-form-msg"></div>';

    document.getElementById('btn-save-address').addEventListener('click', function () {
      var payload = {
        label: document.getElementById('af-label').value.trim() || 'Home',
        line1: document.getElementById('af-line1').value.trim(),
        line2: document.getElementById('af-line2').value.trim(),
        city: document.getElementById('af-city').value.trim(),
        state: document.getElementById('af-state').value.trim(),
        pincode: document.getElementById('af-pincode').value.trim(),
        phone: document.getElementById('af-phone').value.trim(),
        isDefault: addresses.length === 0
      };
      var msgEl = document.getElementById('address-form-msg');
      if (!payload.line1 || !payload.city || !payload.state || !/^\d{6}$/.test(payload.pincode)) {
        msgEl.innerHTML = '<div class="msg err">Please fill in address line 1, city, state, and a 6-digit PIN code.</div>';
        return;
      }
      window.orderApiRequest('/api/addresses', { method: 'POST', body: JSON.stringify(payload) }, accessToken)
        .then(function () {
          showAddressForm = false;
          loadAddresses();
          renderAddressForm();
        })
        .catch(function () {
          msgEl.innerHTML = '<div class="msg err">Could not save that address.</div>';
        });
    });
  }

  function loadDirectory(me) {
    var el = document.getElementById('directory');
    if (!el) return;
    window.supabaseSelect('customer_directory', 'select=id,username,full_name,status&status=not.is.null&order=username.asc')
      .then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) {
          el.innerHTML = '<div class="sub">No one has set a status yet.</div>';
          return;
        }
        el.innerHTML = rows.map(function (row) {
          var name = row.full_name || row.username;
          if (row.id === me.id) name += ' (you)';
          return '<div class="directory-row">' +
            '<span class="directory-name">' + escapeHtml(name) + '</span>' +
            '<span class="directory-status">' + statusChip(row.status) + '</span>' +
          '</div>';
        }).join('');
      })
      .catch(function () {
        el.innerHTML = '<div class="sub">Couldn\'t load statuses right now.</div>';
      });
  }
})();
</script>
</body>
</html>
