<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Wishlist – DumbBrew</title>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
.wrap { max-width:1000px; margin:0 auto; padding:100px 24px 120px; }
a.home { display:inline-block; margin-bottom:28px; font-size:13px; color:#8a5527; text-decoration:none; }
h1 { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; margin:0 0 8px; color:#17100a; }
.sub { font-size:14px; color:#5a412899; margin-bottom:36px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:22px; }
.pcard { background:#faf5ea; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px #24191008; display:flex; flex-direction:column; position:relative; }
.pcard img { width:100%; aspect-ratio:1; object-fit:cover; background:#3b2414; display:block; }
.pbody { padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
.pname { font-weight:600; font-size:15px; margin-bottom:4px; }
.pseller { font-size:11px; letter-spacing:0.5px; text-transform:uppercase; color:#8a5527; margin-bottom:8px; }
.prow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
.pprice { font-weight:700; font-family:'Playfair Display',serif; color:#17100a; }
.add-btn { padding:9px 14px; background:#c99a54; color:#17100a; border:none; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.add-btn:disabled { opacity:0.6; cursor:default; }
.remove-btn { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; border:none; background:#17100acc; color:#f0e5d1; cursor:pointer; font-size:14px; line-height:1; }
.empty { text-align:center; color:#5a412899; padding:60px 0; }
.msg { font-size:12px; margin-top:8px; }
.msg.err { color:#a13a2e; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#17100a; color:#f0e5d1; padding:12px 22px; border-radius:4px; font-size:13px; opacity:0; transition:opacity 0.3s ease; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./index.html">&larr; Back to DumbBrew</a>
  <h1>Your Wishlist</h1>
  <div class="sub">Saved from any seller. Cart checkout still needs items from a single seller at a time.</div>
  <div id="content">Loading&hellip;</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  const accessToken = sessionStorage.getItem('dumbbrew_access_token');
  const contentEl = document.getElementById('content');
  const toastEl = document.getElementById('toast');
  if (!accessToken) {
    window.location.href = './login.html';
    return;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  load();

  function load() {
    window.orderApiRequest('/api/wishlist', { method: 'GET' }, accessToken)
      .then(function (data) {
        render((data && data.items || []).filter(function (it) { return it.products; }));
      })
      .catch(function () {
        contentEl.innerHTML = '<div class="empty">Could not load your wishlist right now.</div>';
      });
  }

  function render(items) {
    if (!items.length) {
      contentEl.innerHTML = '<div class="empty">Nothing saved yet.<br/><br/>' +
        '<a href="./shop.html" style="color:#8a5527;">Browse the shop &rarr;</a></div>';
      return;
    }

    contentEl.innerHTML = '<div class="grid">' + items.map(function (it) {
      const p = it.products;
      const storeName = p.sellers && p.sellers.store_name;
      return '<div class="pcard" data-product-id="' + p.id + '">' +
        '<button class="remove-btn" data-action="remove" aria-label="Remove from wishlist">&times;</button>' +
        '<img src="' + (p.image_key ? window.assetUrl(p.image_key) : '') + '" alt="' + escapeHtml(p.name) + '"/>' +
        '<div class="pbody">' +
          (storeName ? '<div class="pseller">' + escapeHtml(storeName) + '</div>' : '') +
          '<div class="pname">' + escapeHtml(p.name) + '</div>' +
          '<div class="prow">' +
            '<span class="pprice">' + window.formatINR(p.price) + '</span>' +
            '<button class="add-btn" data-action="add-to-cart">Add to Cart</button>' +
          '</div>' +
          '<div class="msg" data-role="msg"></div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    contentEl.querySelectorAll('.pcard').forEach(function (card) {
      const productId = Number(card.dataset.productId);
      card.querySelector('[data-action="remove"]').addEventListener('click', function () { removeItem(productId, card); });
      card.querySelector('[data-action="add-to-cart"]').addEventListener('click', function (e) { addToCart(productId, e.target, card); });
    });
  }

  function removeItem(productId, card) {
    window.orderApiRequest('/api/wishlist/items/' + productId, { method: 'DELETE' }, accessToken)
      .then(function () { card.remove(); if (!contentEl.querySelector('.pcard')) load(); })
      .catch(function () { showToast('Could not remove that item'); });
  }

  function addToCart(productId, btn, card) {
    btn.disabled = true;
    const msgEl = card.querySelector('[data-role="msg"]');
    msgEl.textContent = '';
    window.orderApiRequest('/api/cart/items', {
      method: 'POST',
      body: JSON.stringify({ productId: productId, quantity: 1 })
    }, accessToken)
      .then(function () {
        showToast('Added to cart');
        btn.disabled = false;
      })
      .catch(function (err) {
        btn.disabled = false;
        if (err && err.body && err.body.error === 'different_seller_in_cart') {
          msgEl.className = 'msg err';
          msgEl.textContent = 'Your cart has items from a different seller — check out or clear your cart first.';
        } else {
          showToast('Could not add that item');
        }
      });
  }
})();
</script>
</body>
</html>
