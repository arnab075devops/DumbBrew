<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorials – DumbBrew Admin</title>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.snow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.min.js"></script>
<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
.wrap { max-width:860px; margin:0 auto; padding:100px 24px 120px; }
.card { background:#faf5ea; border-radius:14px; padding:32px; box-shadow:0 2px 8px #24191008; margin-bottom:28px; }
h1 { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; margin:0 0 4px; color:#17100a; }
.sub { font-size:13px; color:#5a412899; }
label { display:block; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#5a4128; margin-bottom:8px; margin-top:20px; }
label:first-of-type { margin-top:0; }
input[type="email"], input[type="password"], input[type="text"], textarea {
  width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #3b241422; border-radius:6px;
  background:#fff; font-size:14px; font-family:'Poppins',sans-serif; color:#241a10; outline:none;
}
textarea { min-height:70px; resize:vertical; }
input:focus, textarea:focus { border-color:#c99a54; }
.field-note { font-size:12px; color:#5a412888; margin-top:6px; }
button.primary { padding:13px 28px; background:#17100a; color:#f0e5d1; border:none; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; margin-top:18px; }
button.primary:disabled { opacity:0.5; cursor:default; }
button.secondary { padding:13px 24px; background:#fff; color:#17100a; border:1px solid #3b241433; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; margin-top:18px; margin-left:10px; }
button.link { background:none; border:none; color:#8a5527; font-size:13px; cursor:pointer; padding:0; font-weight:500; }
.top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.tutorial-row { padding:18px 0; border-top:1px solid #3b241418; display:flex; gap:14px; align-items:center; }
.tutorial-row:first-child { border-top:none; }
.tutorial-thumb { width:60px; height:60px; border-radius:8px; object-fit:cover; background:#3b241411; flex-shrink:0; }
.tutorial-body { flex:1; min-width:0; }
.tutorial-title { font-weight:600; font-size:15px; }
.tutorial-meta { font-size:12px; color:#5a412899; margin-top:2px; }
.badge { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 8px; border-radius:10px; margin-left:8px; }
.badge.draft { background:#c99a5433; color:#8a5527; }
.badge.published { background:#7d8a4c22; color:#5a7d3c; }
.row-actions { display:flex; gap:8px; }
.row-actions button { padding:7px 14px; border-radius:1px; border:1px solid #3b241433; background:#fff; font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; }
.row-actions .danger { color:#a13a2e; border-color:#a13a2e55; }
.msg { font-size:13px; margin-top:14px; }
.msg.err { color:#a13a2e; }
.msg.ok { color:#5a7d3c; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.thumb-picker { display:flex; align-items:center; gap:14px; margin-top:8px; }
.thumb-preview { width:90px; height:90px; border-radius:8px; object-fit:cover; background:#3b241411; flex-shrink:0; }
.thumb-preview.empty { display:flex; align-items:center; justify-content:center; font-size:11px; color:#5a412888; }
#editor-container { background:#fff; border:1px solid #3b241422; border-radius:6px; margin-top:20px; }
.ql-toolbar.ql-snow { border:none; border-bottom:1px solid #3b241422; border-radius:6px 6px 0 0; }
.ql-container.ql-snow { border:none; font-size:15px; font-family:'Poppins',sans-serif; min-height:360px; }
.publish-row { display:flex; align-items:center; gap:12px; margin-top:24px; }
.publish-row label { display:flex; align-items:center; gap:8px; margin:0; text-transform:none; font-size:13px; font-weight:500; letter-spacing:normal; color:#241a10; }
.publish-row input[type="checkbox"] { width:16px; height:16px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div id="content">Loading&hellip;</div>
</div>
<script>
(function () {
  const contentEl = document.getElementById('content');
  const TOKEN_KEY = 'dumbbrew_admin_access_token';
  let adminToken = sessionStorage.getItem(TOKEN_KEY);
  let quill = null;
  let currentThumbnailKey = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slugPreview(title) {
    return String(title || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120);
  }

  function api(path, init) {
    return window.orderApiRequest(path, init || {}, adminToken).catch(function (err) {
      if (err && (err.status === 401 || err.status === 403)) {
        sessionStorage.removeItem(TOKEN_KEY);
        adminToken = null;
        renderLogin('Your session expired — please sign in again.');
      }
      throw err;
    });
  }

  if (!adminToken) renderLogin();
  else renderList();

  function renderLogin(errorMsg) {
    contentEl.innerHTML =
      '<div class="card">' +
        '<h1>Admin Sign In</h1>' +
        '<div class="sub">Tutorials</div>' +
        '<label for="af-email">Email</label><input type="email" id="af-email"/>' +
        '<label for="af-password">Password</label><input type="password" id="af-password"/>' +
        '<button class="primary" id="btn-login">Sign In</button>' +
        '<div id="login-msg">' + (errorMsg ? '<div class="msg err">' + escapeHtml(errorMsg) + '</div>' : '') + '</div>' +
      '</div>';

    document.getElementById('btn-login').addEventListener('click', function () {
      const email = document.getElementById('af-email').value.trim();
      const password = document.getElementById('af-password').value;
      const btn = document.getElementById('btn-login');
      const msgEl = document.getElementById('login-msg');
      btn.disabled = true;
      msgEl.innerHTML = '<div class="msg">Signing in&hellip;</div>';
      const { API_BASE } = window.APP_CONFIG;
      fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
        .then(function (res) {
          if (!res.ok) {
            btn.disabled = false;
            msgEl.innerHTML = '<div class="msg err">Invalid credentials.</div>';
            return;
          }
          adminToken = res.body.accessToken;
          sessionStorage.setItem(TOKEN_KEY, adminToken);
          renderList();
        })
        .catch(function () {
          btn.disabled = false;
          msgEl.innerHTML = '<div class="msg err">Could not sign in right now.</div>';
        });
    });
  }

  function renderList() {
    contentEl.innerHTML =
      '<div class="top-row">' +
        '<div><h1>Tutorials</h1><div class="sub">Recipe &amp; brewing how-tos shown on the public site</div></div>' +
        '<div><button class="link" id="btn-logout">Sign Out</button></div>' +
      '</div>' +
      '<div class="card">' +
        '<button class="primary" id="btn-new">New Tutorial</button>' +
        '<div id="list-body" style="margin-top:10px;">Loading&hellip;</div>' +
      '</div>';

    document.getElementById('btn-logout').addEventListener('click', function () {
      sessionStorage.removeItem(TOKEN_KEY);
      adminToken = null;
      renderLogin();
    });
    document.getElementById('btn-new').addEventListener('click', function () { renderEditor(null); });

    api('/api/admin/tutorials').then(function (data) {
      const tutorials = (data && data.tutorials) || [];
      const listEl = document.getElementById('list-body');
      if (!tutorials.length) {
        listEl.innerHTML = '<div class="sub" style="padding:20px 0;">No tutorials yet.</div>';
        return;
      }
      listEl.innerHTML = tutorials.map(function (t) {
        return '<div class="tutorial-row" data-id="' + t.id + '">' +
          (t.thumbnail_key
            ? '<img class="tutorial-thumb" src="' + escapeHtml(window.tutorialAssetUrl(t.thumbnail_key)) + '"/>'
            : '<div class="tutorial-thumb"></div>') +
          '<div class="tutorial-body">' +
            '<div class="tutorial-title">' + escapeHtml(t.title) +
              '<span class="badge ' + (t.published ? 'published' : 'draft') + '">' + (t.published ? 'Published' : 'Draft') + '</span>' +
            '</div>' +
            '<div class="tutorial-meta">' + escapeHtml(t.category || 'Uncategorized') + ' &middot; /' + escapeHtml(t.slug) + '</div>' +
          '</div>' +
          '<div class="row-actions">' +
            '<button type="button" data-edit="' + t.id + '">Edit</button>' +
            '<button type="button" class="danger" data-del="' + t.id + '">Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
      listEl.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () { renderEditor(tutorials.find(function (t) { return String(t.id) === btn.dataset.edit; })); });
      });
      listEl.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Delete this tutorial? This cannot be undone.')) return;
          api('/api/admin/tutorials/' + btn.dataset.del, { method: 'DELETE' }).then(renderList);
        });
      });
    }).catch(function () {
      document.getElementById('list-body').innerHTML = '<div class="msg err">Could not load tutorials.</div>';
    });
  }

  function uploadFile(file) {
    return api('/api/admin/tutorials/presign-upload', {
      method: 'POST',
      body: JSON.stringify({ fileName: file.name, contentType: file.type })
    }).then(function (data) {
      return fetch(data.uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file })
        .then(function () { return { imageKey: data.imageKey, url: window.tutorialAssetUrl(data.imageKey) }; });
    });
  }

  function renderEditor(existing) {
    currentThumbnailKey = existing ? existing.thumbnail_key : null;
    contentEl.innerHTML =
      '<div class="top-row">' +
        '<div><h1>' + (existing ? 'Edit Tutorial' : 'New Tutorial') + '</h1><div class="sub">Write it like an article — add photos and a video wherever they help.</div></div>' +
        '<div><button class="link" id="btn-back">&larr; Back to list</button></div>' +
      '</div>' +
      '<div class="card">' +
        '<label for="ef-title">Title</label><input type="text" id="ef-title" value="' + escapeHtml(existing ? existing.title : '') + '"/>' +
        '<div class="field-note">Slug: <span id="slug-preview">' + escapeHtml(existing ? existing.slug : '') + '</span></div>' +
        '<div class="two-col">' +
          '<div><label for="ef-category">Category</label><input type="text" id="ef-category" placeholder="e.g. Pour Over" value="' + escapeHtml(existing ? (existing.category || '') : '') + '"/></div>' +
          '<div><label for="ef-video">Hero video URL (optional)</label><input type="text" id="ef-video" placeholder="https://youtube.com/watch?v=..." value="' + escapeHtml(existing ? (existing.video_url || '') : '') + '"/></div>' +
        '</div>' +
        '<label for="ef-excerpt">Excerpt</label><textarea id="ef-excerpt">' + escapeHtml(existing ? existing.excerpt : '') + '</textarea>' +
        '<label>Thumbnail</label>' +
        '<div class="thumb-picker">' +
          (currentThumbnailKey
            ? '<img class="thumb-preview" id="thumb-preview" src="' + escapeHtml(window.tutorialAssetUrl(currentThumbnailKey)) + '"/>'
            : '<div class="thumb-preview empty" id="thumb-preview">No image</div>') +
          '<input type="file" id="ef-thumb-file" accept="image/png,image/jpeg,image/webp"/>' +
        '</div>' +
        '<label>Article body</label>' +
        '<div id="editor-container"></div>' +
        '<div class="publish-row">' +
          '<label><input type="checkbox" id="ef-published" ' + (existing && existing.published ? 'checked' : '') + '/> Published (visible on the public site)</label>' +
        '</div>' +
        '<button class="primary" id="btn-save">Save</button>' +
        '<button class="secondary" id="btn-preview-cancel">Cancel</button>' +
        '<div id="editor-msg"></div>' +
      '</div>';

    document.getElementById('btn-back').addEventListener('click', renderList);
    document.getElementById('btn-preview-cancel').addEventListener('click', renderList);
    document.getElementById('ef-title').addEventListener('input', function (ev) {
      document.getElementById('slug-preview').textContent = slugPreview(ev.target.value);
    });
    document.getElementById('ef-thumb-file').addEventListener('change', function (ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const preview = document.getElementById('thumb-preview');
      preview.textContent = 'Uploading…';
      uploadFile(file).then(function (res) {
        currentThumbnailKey = res.imageKey;
        const img = document.createElement('img');
        img.className = 'thumb-preview';
        img.id = 'thumb-preview';
        img.src = res.url;
        preview.replaceWith(img);
      }).catch(function () {
        preview.textContent = 'Upload failed';
      });
    });

    quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          ['blockquote'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image', 'video'],
          ['clean']
        ]
      }
    });
    if (existing && existing.body_html) quill.root.innerHTML = existing.body_html;

    // Quill's default image handler base64-embeds the file inline — replace
    // it so images upload to R2 (like the thumbnail) and only the resulting
    // public URL lands in the stored HTML.
    quill.getModule('toolbar').addHandler('image', function () {
      const input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/png,image/jpeg,image/webp');
      input.click();
      input.onchange = function () {
        const file = input.files[0];
        if (!file) return;
        const range = quill.getSelection(true);
        uploadFile(file).then(function (res) {
          quill.insertEmbed(range.index, 'image', res.url, 'user');
          quill.setSelection(range.index + 1);
        }).catch(function () {
          alert('Image upload failed.');
        });
      };
    });
    // Quill's built-in video handler already turns a pasted YouTube/Vimeo
    // link into an embeddable iframe — no override needed there.

    document.getElementById('btn-save').addEventListener('click', function () {
      const btn = document.getElementById('btn-save');
      const msgEl = document.getElementById('editor-msg');
      const title = document.getElementById('ef-title').value.trim();
      if (!title) { msgEl.innerHTML = '<div class="msg err">Title is required.</div>'; return; }
      btn.disabled = true;
      msgEl.innerHTML = '<div class="msg">Saving&hellip;</div>';
      const payload = {
        title: title,
        category: document.getElementById('ef-category').value.trim() || undefined,
        videoUrl: document.getElementById('ef-video').value.trim() || undefined,
        excerpt: document.getElementById('ef-excerpt').value.trim(),
        thumbnailKey: currentThumbnailKey || undefined,
        bodyHtml: quill.root.innerHTML,
        published: document.getElementById('ef-published').checked
      };
      const req = existing
        ? api('/api/admin/tutorials/' + existing.id, { method: 'PATCH', body: JSON.stringify(payload) })
        : api('/api/admin/tutorials', { method: 'POST', body: JSON.stringify(payload) });
      req.then(function () { renderList(); })
        .catch(function (err) {
          btn.disabled = false;
          const reason = err && err.body && err.body.error === 'slug_taken' ? 'That title produces a slug already in use — try a different title.' : 'Could not save.';
          msgEl.innerHTML = '<div class="msg err">' + reason + '</div>';
        });
    });
  }
})();
</script>
</body>
</html>
