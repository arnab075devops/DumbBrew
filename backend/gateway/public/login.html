      <a href="./data-policy.html" style="text-decoration:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa;">Data Policy</a>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
// PKCE (RFC 7636) helpers — Web Crypto only, no library needed.
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomVerifier() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return b64url(bytes.buffer);
}
async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(digest);
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { errorMessage: '' };
  }
  componentDidMount() {
    this.reduceMotion = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.hasGsap = !!(window.gsap && window.ScrollTrigger);
    if (this.hasGsap) window.gsap.registerPlugin(window.ScrollTrigger);
    this.attachReveal();
    this.attachNavScroll();
  }
  componentDidUpdate() { this.attachReveal(); }
  attachReveal() {
    const root = this.rootNode || document;
    const els = Array.from(root.querySelectorAll('[data-reveal]')).filter(el => !el.dataset.revealBound);
    if (!els.length) { requestAnimationFrame(() => { if (!this._retried) { this._retried = true; this.attachReveal(); } }); return; }
    els.forEach((el) => { el.dataset.revealBound = '1'; });
    if (this.reduceMotion || !this.hasGsap) {
      els.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });
      return;
    }
    const gsap = window.gsap, ScrollTrigger = window.ScrollTrigger;
    this._triggers = this._triggers || [];
    ScrollTrigger.batch(els, {
      start: 'top 88%',
      once: true,
      onEnter: (batch) => { gsap.to(batch, { opacity: 1, y: 0, duration: 1, ease: 'power4.out', stagger: 0.08, overwrite: 'auto' }); }
    }).forEach((st) => this._triggers.push(st));
  }
  attachNavScroll() {
    if (!this.hasGsap) return;
    const root = this.rootNode || document;
    const nav = root.querySelector('[data-nav]');
    if (!nav) return;
    const gsap = window.gsap, ScrollTrigger = window.ScrollTrigger;
    this._triggers = this._triggers || [];
    const dur = this.reduceMotion ? 0 : 0.3;
    const st = ScrollTrigger.create({
      start: 'top -40',
      onEnter: () => gsap.to(nav, { backgroundColor: '#f0e5d1f0', boxShadow: '0 8px 30px #3b241422', duration: dur, ease: 'power1.out', overwrite: 'auto' }),
      onLeaveBack: () => gsap.to(nav, { backgroundColor: '#f0e5d1b3', boxShadow: '0 0 0 rgba(0,0,0,0)', duration: dur, ease: 'power1.out', overwrite: 'auto' })
    });
    this._triggers.push(st);
  }
  componentWillUnmount() {
    if (this._triggers) this._triggers.forEach((st) => st && st.kill && st.kill());
  }
  renderVals() {
    return {
      rootRef: (el) => { this.rootNode = el; },
      logoUrl: window.assetUrl('db-logo.png'),
      errorMessage: this.state.errorMessage,
      handleLogin: async () => {
        const { AUTHENTIK_URL, AUTHENTIK_CLIENT_ID, AUTHENTIK_REDIRECT_URI } = window.APP_CONFIG;
        if (!AUTHENTIK_URL || !AUTHENTIK_CLIENT_ID || AUTHENTIK_URL.indexOf('YOUR-VM-IP') !== -1) {
          this.setState({ errorMessage: 'Sign-in isn’t configured yet — see docs/AUTHENTIK_SETUP.md.' });
          return;
        }
        const verifier = randomVerifier();
        const challenge = await challengeFor(verifier);
        const state = randomVerifier();
        sessionStorage.setItem('dumbbrew_pkce_verifier', verifier);
        sessionStorage.setItem('dumbbrew_oauth_state', state);
        const params = new URLSearchParams({
          client_id: AUTHENTIK_CLIENT_ID,
          redirect_uri: AUTHENTIK_REDIRECT_URI,
          response_type: 'code',
          scope: 'openid profile email',
          state,
          code_challenge: challenge,
          code_challenge_method: 'S256'
        });
        window.location.href = AUTHENTIK_URL.replace(/\/$/, '') + '/application/o/authorize/?' + params.toString();
      }
    };
  }
}
</script>
</body>
