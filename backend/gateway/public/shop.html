<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop – DumbBrew</title>
<script src="./config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
.wrap { max-width:1000px; margin:0 auto; padding:100px 24px 120px; }
a.home { display:inline-block; margin-bottom:28px; font-size:13px; color:#8a5527; text-decoration:none; }
h1 { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; margin:0 0 8px; color:#17100a; }
.sub { font-size:14px; color:#5a412899; margin-bottom:36px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:22px; }
.pcard { background:#faf5ea; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px #24191008; display:flex; flex-direction:column; position:relative; transition:box-shadow 0.3s ease; }
.pcard.highlight { box-shadow:0 0 0 3px #c99a54; }
.pcard img { width:100%; aspect-ratio:1; object-fit:cover; background:#3b2414; display:block; }
.wish-btn { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; border:none; background:#17100acc; color:#f0e5d1; cursor:pointer; font-size:15px; line-height:1; z-index:1; }
.wish-btn.on { color:#e0684f; }
.pbody { padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
.pname { font-weight:600; font-size:15px; margin-bottom:4px; }
.pseller { font-size:11px; letter-spacing:0.5px; text-transform:uppercase; color:#8a5527; margin-bottom:8px; }
.pdesc { font-size:13px; color:#5a4128; flex:1; margin-bottom:12px; line-height:1.5; }
.prow { display:flex; align-items:center; justify-content:space-between; }
.pprice { font-weight:700; font-family:'Playfair Display',serif; color:#17100a; }
.add-btn { padding:9px 16px; background:#c99a54; color:#17100a; border:none; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.add-btn:disabled { opacity:0.6; cursor:default; }
.pdesc-msg { font-size:12px; color:#a13a2e; margin-top:6px; }
.empty { text-align:center; color:#5a412899; padding:60px 0; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#17100a; color:#f0e5d1; padding:12px 22px; border-radius:4px; font-size:13px; opacity:0; transition:opacity 0.3s ease; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./index.html">&larr; Back to DumbBrew</a>
  <a class="home" href="./wishlist.html" style="float:right;">Wishlist &rarr;</a>
  <h1>Shop</h1>
  <div class="sub">Everything currently for sale across DumbBrew and our onboarded sellers.</div>
  <div id="content">Loading&hellip;</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  const contentEl = document.getElementById('content');
  const toastEl = document.getElementById('toast');
  const accessToken = sessionStorage.getItem('dumbbrew_access_token');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // The `sellers` table itself has no public-read RLS policy (only "own
  // row" — see schema.sql), so a products?select=...,sellers(store_name)
  // embed would silently come back null for every row under the anon key.
  // seller_directory is the public-readable view for this — it has no FK
  // for PostgREST to auto-embed, so it's fetched separately and merged here.
  let wishlistIds = [];

  Promise.all([
    window.supabaseSelect('products', 'select=id,name,description,price,image_key,seller_id&active=eq.true&order=sort.asc'),
    window.supabaseSelect('seller_directory', 'select=id,store_name'),
    accessToken ? window.orderApiRequest('/api/wishlist', { method: 'GET' }, accessToken).catch(function () { return { items: [] }; }) : Promise.resolve({ items: [] })
  ])
    .then(function (results) {
      const products = results[0];
      const sellerNames = {};
      results[1].forEach(function (s) { sellerNames[s.id] = s.store_name; });
      wishlistIds = (results[2].items || []).map(function (it) { return it.product_id; });
      if (!products.length) {
        contentEl.innerHTML = '<div class="empty">Nothing for sale right now — check back soon.</div>';
        return;
      }
      render(products, sellerNames);
      highlightFromQuery();
    })
    .catch(function () {
      contentEl.innerHTML = '<div class="empty">Could not load the shop right now.</div>';
    });

  function render(products, sellerNames) {
    contentEl.innerHTML = '<div class="grid">' + products.map(function (p) {
      const storeName = sellerNames[p.seller_id];
      const wished = wishlistIds.indexOf(p.id) !== -1;
      return '<div class="pcard" id="product-' + p.id + '" data-id="' + p.id + '">' +
        '<button class="wish-btn' + (wished ? ' on' : '') + '" data-action="wish" aria-label="Save to wishlist">' + (wished ? '&#9829;' : '&#9825;') + '</button>' +
        '<img src="' + (p.image_key ? window.assetUrl(p.image_key) : '') + '" alt="' + escapeHtml(p.name) + '"/>' +
        '<div class="pbody">' +
          (storeName ? '<div class="pseller">' + escapeHtml(storeName) + '</div>' : '') +
          '<div class="pname">' + escapeHtml(p.name) + '</div>' +
          '<div class="pdesc">' + escapeHtml(p.description || '') + '</div>' +
          '<div class="prow">' +
            '<span class="pprice">' + window.formatINR(p.price) + '</span>' +
            '<button class="add-btn" data-action="add-to-cart">Add to Cart</button>' +
          '</div>' +
          '<div class="pdesc-msg" data-role="msg"></div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    contentEl.querySelectorAll('.pcard').forEach(function (card) {
      const productId = Number(card.dataset.id);
      card.querySelector('[data-action="add-to-cart"]').addEventListener('click', function (e) { addToCart(productId, e.target, card); });
      card.querySelector('[data-action="wish"]').addEventListener('click', function (e) { toggleWishlist(productId, e.target); });
    });
  }

  function highlightFromQuery() {
    const id = new URLSearchParams(window.location.search).get('highlight');
    if (!id) return;
    const card = document.getElementById('product-' + id);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('highlight');
    setTimeout(function () { card.classList.remove('highlight'); }, 2400);
  }

  function addToCart(productId, btn, card) {
    if (!accessToken) {
      window.location.href = './login.html';
      return;
    }
    btn.disabled = true;
    const msgEl = card.querySelector('[data-role="msg"]');
    msgEl.textContent = '';
    window.orderApiRequest('/api/cart/items', {
      method: 'POST',
      body: JSON.stringify({ productId: productId, quantity: 1 })
    }, accessToken)
      .then(function () {
        showToast('Added to cart');
        btn.disabled = false;
      })
      .catch(function (err) {
        btn.disabled = false;
        if (err && err.body && err.body.error === 'different_seller_in_cart') {
          msgEl.textContent = 'Cart has items from another seller — check out or clear it first.';
        } else {
          showToast('Could not add that item');
        }
      });
  }

  function toggleWishlist(productId, btn) {
    if (!accessToken) {
      window.location.href = './login.html';
      return;
    }
    const wished = wishlistIds.indexOf(productId) !== -1;
    btn.disabled = true;
    const request = wished
      ? window.orderApiRequest('/api/wishlist/items/' + productId, { method: 'DELETE' }, accessToken)
      : window.orderApiRequest('/api/wishlist/items', { method: 'POST', body: JSON.stringify({ productId: productId }) }, accessToken);
    request
      .then(function () {
        if (wished) {
          wishlistIds = wishlistIds.filter(function (id) { return id !== productId; });
          btn.classList.remove('on');
          btn.innerHTML = '&#9825;';
        } else {
          wishlistIds.push(productId);
          btn.classList.add('on');
          btn.innerHTML = '&#9829;';
        }
        btn.disabled = false;
      })
      .catch(function () {
        showToast('Could not update your wishlist');
        btn.disabled = false;
      });
  }
})();
</script>
</body>
</html>
