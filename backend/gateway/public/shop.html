<style>
body { margin:0; min-height:100vh; background:#f0e5d1; color:#241a10; font-family:'Poppins',sans-serif; }
a { color:#8a5527; }
.site-nav { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(20px,4vw,72px); position:sticky; top:0; background:#f0e5d1b3; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #3b241414; z-index:20; color:#241a10; flex-wrap:wrap; gap:16px; }
.site-nav .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
.site-nav .brand img { width:40px; height:40px; object-fit:contain; display:block; }
.site-nav .brand-name { font-family:'Playfair Display',serif; font-weight:700; font-size:20px; letter-spacing:1px; color:#17100a; }
.site-nav .links { display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
.site-nav .links a { text-decoration:none; font-size:12.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#3b2414cc; transition:color 0.3s ease; }
.site-nav .links a:hover, .site-nav .links a.active { color:#8a5527; }
.icon-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid #3b241433; color:#3b2414cc; transition:color 0.3s ease, border-color 0.3s ease; flex:none; position:relative; text-decoration:none; background:none; cursor:pointer; padding:0; }
.icon-btn:hover { color:#8a5527; border-color:#8a552766; }
.page-head { background:#17100a; color:#f0e5d1; padding:64px clamp(20px,4vw,72px) 52px; }
.page-head .eyebrow { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#c99a54; font-weight:500; margin-bottom:14px; }
.page-head h1 { font-family:'Playfair Display',serif; font-size:clamp(28px,4vw,44px); font-weight:900; margin:0; letter-spacing:-1px; color:#f0e5d1; }
.page-head p { font-size:14px; color:#f0e5d1aa; margin:14px 0 0; font-weight:300; max-width:560px; line-height:1.7; }
.site-footer { background:#17100a; color:#f0e5d1; padding:48px clamp(20px,4vw,72px); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
.site-footer .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
.site-footer .brand img { width:28px; height:28px; object-fit:contain; display:block; }
.site-footer .brand span { font-family:'Playfair Display',serif; font-weight:700; font-size:15px; letter-spacing:1px; }
.site-footer .copy { font-size:11px; color:#f0e5d166; letter-spacing:0.5px; }
.site-footer .links { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.site-footer .links a { text-decoration:none; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#f0e5d1aa; }
.site-footer .partner { color:#f0e5d1; border:1px solid #f0e5d155; padding:8px 16px; border-radius:1px; letter-spacing:1.5px; }
.wrap { max-width:1000px; margin:0 auto; padding:56px clamp(20px,4vw,40px) 120px; }
.filter-bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:18px 20px; background:#faf5ea; border-radius:12px; box-shadow:0 2px 8px #24191008; margin-bottom:36px; }
.filter-chips { display:flex; flex-wrap:wrap; gap:8px; }
.filter-chip { border:1px solid #3b241422; background:#fff; color:#5a4128; font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; padding:7px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; }
.filter-chip:hover { border-color:#8a552766; }
.filter-chip.active { background:#17100a; color:#f0e5d1; border-color:#17100a; }
.filter-select { padding:8px 12px; border:1px solid #3b241422; border-radius:20px; background:#fff; color:#5a4128; font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; }
.filter-sep { width:1px; align-self:stretch; background:#3b241422; }
@media (max-width: 640px) { .filter-sep { display:none; } }
.shop-group { margin-bottom:52px; }
.shop-group:last-child { margin-bottom:0; }
.group-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid #3b241422; }
.group-title { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:#17100a; }
.group-count { font-size:12px; color:#5a412899; letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:22px; }
.pcard { background:#faf5ea; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px #24191008; display:flex; flex-direction:column; position:relative; transition:box-shadow 0.3s ease; }
.pcard.highlight { box-shadow:0 0 0 3px #c99a54; }
.pcard img { width:100%; aspect-ratio:1; object-fit:cover; background:#3b2414; display:block; }
.pcard-icon { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:#e7dac2; }
.pcard-icon svg { width:62%; height:62%; display:block; }
.wish-btn { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; border:none; background:#17100acc; color:#f0e5d1; cursor:pointer; font-size:15px; line-height:1; z-index:1; }
.wish-btn.on { color:#e0684f; }
.pbody { padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
.tag-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 9px; border-radius:10px; white-space:nowrap; }
.tag-green { background:#7d8a4c22; color:#5a7d3c; }
.tag-red { background:#a13a2e1a; color:#a13a2e; }
.tag-seller { font-size:11px; color:#8a5527; font-weight:500; }
.pname { font-weight:600; font-size:15px; margin-bottom:4px; }
.pdesc { font-size:13px; color:#5a4128; flex:1; margin-bottom:12px; line-height:1.5; }
.prow { display:flex; align-items:center; justify-content:space-between; }
.pprice { font-weight:700; font-family:'Playfair Display',serif; color:#17100a; }
.add-btn { padding:9px 16px; background:#c99a54; color:#17100a; border:none; border-radius:1px; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.add-btn:disabled { opacity:0.6; cursor:default; }
.pdesc-msg { font-size:12px; color:#a13a2e; margin-top:6px; }
.empty { text-align:center; color:#5a412899; padding:60px 0; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#17100a; color:#f0e5d1; padding:12px 22px; border-radius:4px; font-size:13px; opacity:0; transition:opacity 0.3s ease; pointer-events:none; }
.toast.show { opacity:1; }
@media (max-width: 640px) {
  .site-nav { padding:14px 16px; }
  .page-head { padding:40px 16px 32px; }
  .wrap { padding:28px 16px 80px; }
  .site-footer { padding:32px 16px; flex-direction:column; text-align:center; }
}
</style>

<script>
(function () {
  const contentEl = document.getElementById('content');
  const toastEl = document.getElementById('toast');
  const accessToken = sessionStorage.getItem('dumbbrew_access_token');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // Hand-drawn vector icons, one per catalog group — used as the product
  // image whenever a listing has no photo (image_key), instead of a blank
  // placeholder. Falls back to a coffee-bean mark for any category outside
  // this list (e.g. a seller's own category name).
  const GROUP_ICONS = {
    'Hot Coffee': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 28h24v10a12 12 0 0 1-12 12h0a12 12 0 0 1-12-12V28z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M40 30h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M22 16c0 2-3 3-3 6M29 16c0 2-3 3-3 6M36 16c0 2-3 3-3 6" fill="none" stroke="#c99a54" stroke-width="2" stroke-linecap="round"/></svg>',
    'Cold Drinks': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M20 20h24l-3 28a3 3 0 0 1-3 3H26a3 3 0 0 1-3-3L20 20z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M22 26h20" stroke="#5a4128" stroke-width="1.6" opacity="0.5"/><rect x="26" y="19" width="7" height="7" rx="1.5" fill="none" stroke="#c99a54" stroke-width="1.6" transform="rotate(20 29.5 22.5)"/><path d="M40 14l-4 38" stroke="#8a5527" stroke-width="2.2" stroke-linecap="round"/></svg>',
    'Smoothies & Juices': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M21 22h22l-2.5 26a3 3 0 0 1-3 2.7H26.5a3 3 0 0 1-3-2.7L21 22z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><circle cx="40" cy="20" r="6" fill="none" stroke="#c99a54" stroke-width="2"/><path d="M40 14v12M34 20h12" stroke="#c99a54" stroke-width="1.4"/><path d="M38 12l-2 40" stroke="#8a5527" stroke-width="2.2" stroke-linecap="round"/></svg>',
    'Hot Chocolate & Specialty': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 30h24v8a12 12 0 0 1-12 12h0a12 12 0 0 1-12-12v-8z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M40 32h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M18 30c2-4 4-4 6-8s4-4 6-8" fill="none" stroke="#c99a54" stroke-width="2.2" stroke-linecap="round"/><circle cx="30" cy="14" r="1.6" fill="#c99a54"/></svg>',
    'Tea': '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><path d="M16 30h22v6a11 11 0 0 1-11 11h0a11 11 0 0 1-11-11v-6z" fill="none" stroke="#5a4128" stroke-width="2.2" stroke-linejoin="round"/><path d="M38 32h4a4.5 4.5 0 0 1 0 9h-4" fill="none" stroke="#5a4128" stroke-width="2.2"/><path d="M27 30V18l6-4" fill="none" stroke="#c99a54" stroke-width="1.6"/><rect x="30" y="9" width="6" height="4.5" rx="1" fill="none" stroke="#c99a54" stroke-width="1.4"/></svg>'
  };
  const DEFAULT_ICON = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e7dac2"/><ellipse cx="32" cy="32" rx="14" ry="20" fill="none" stroke="#5a4128" stroke-width="2.2" transform="rotate(20 32 32)"/><path d="M32 14c-4 8-4 28 0 36" fill="none" stroke="#5a4128" stroke-width="2" transform="rotate(20 32 32)"/></svg>';
  function iconFor(category) { return GROUP_ICONS[category] || DEFAULT_ICON; }

  // The `sellers` table itself has no public-read RLS policy (only "own
  // row" — see schema.sql), so a products?select=...,sellers(store_name)
  // embed would silently come back null for every row under the anon key.
  // seller_directory is the public-readable view for this — it has no FK
  // for PostgREST to auto-embed, so it's fetched separately and merged here.
  let wishlistIds = [];
  let allProducts = [];
  let allSellers = {};
  let selectedCategory = 'all';
  let selectedSellerId = 'all';

  Promise.all([
    window.supabaseSelect('products', 'select=id,name,description,price,image_key,category,seller_id&active=eq.true&order=sort.asc'),
    window.supabaseSelect('seller_directory', 'select=id,store_name,is_house'),
    accessToken ? window.orderApiRequest('/api/wishlist', { method: 'GET' }, accessToken).catch(function () { return { items: [] }; }) : Promise.resolve({ items: [] })
  ])
    .then(function (results) {
      allProducts = results[0];
      allSellers = {};
      results[1].forEach(function (s) { allSellers[s.id] = s; });
      wishlistIds = (results[2].items || []).map(function (it) { return it.product_id; });
      if (!allProducts.length) {
        document.getElementById('filter-bar').hidden = true;
        contentEl.innerHTML = '<div class="empty">Nothing for sale right now — check back soon.</div>';
        return;
      }
      renderFilterBar();
      applyFilters();
      highlightFromQuery();
    })
    .catch(function () {
      contentEl.innerHTML = '<div class="empty">Could not load the shop right now.</div>';
    });

  // Categories/sellers are derived from what's actually on sale (in the
  // order each first appears), same spirit as groupByCategory below — the
  // filter bar only ever offers choices that currently return results.
  function renderFilterBar() {
    const barEl = document.getElementById('filter-bar');
    const categories = [];
    allProducts.forEach(function (p) {
      const c = p.category || 'Other';
      if (categories.indexOf(c) === -1) categories.push(c);
    });
    const sellerIds = [];
    allProducts.forEach(function (p) {
      if (sellerIds.indexOf(p.seller_id) === -1) sellerIds.push(p.seller_id);
    });

    const chipsHtml = '<button type="button" class="filter-chip' + (selectedCategory === 'all' ? ' active' : '') + '" data-category="all">All</button>' +
      categories.map(function (c) {
        return '<button type="button" class="filter-chip' + (selectedCategory === c ? ' active' : '') + '" data-category="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
      }).join('');

    const sellerOptionsHtml = '<option value="all">All sellers</option>' +
      sellerIds.map(function (id) {
        const s = allSellers[id];
        const label = s ? (s.is_house ? s.store_name + ' (Admin Managed)' : s.store_name) : 'Unknown seller';
        return '<option value="' + id + '"' + (selectedSellerId === id ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
      }).join('');

    barEl.hidden = false;
    barEl.innerHTML =
      '<div class="filter-chips" id="filter-category-chips">' + chipsHtml + '</div>' +
      '<div class="filter-sep"></div>' +
      '<select class="filter-select" id="filter-seller-select">' + sellerOptionsHtml + '</select>';

    barEl.querySelectorAll('[data-category]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        selectedCategory = btn.dataset.category;
        renderFilterBar();
        applyFilters();
      });
    });
    document.getElementById('filter-seller-select').addEventListener('change', function (e) {
      selectedSellerId = e.target.value; // seller_id is a uuid string, incl. 'all'
      applyFilters();
    });
  }

  function applyFilters() {
    const filtered = allProducts.filter(function (p) {
      const categoryMatch = selectedCategory === 'all' || (p.category || 'Other') === selectedCategory;
      const sellerMatch = selectedSellerId === 'all' || p.seller_id === selectedSellerId;
      return categoryMatch && sellerMatch;
    });
    if (!filtered.length) {
      contentEl.innerHTML = '<div class="empty">No products match these filters.</div>';
      return;
    }
    render(filtered, allSellers);
  }

  // Groups a shop section per distinct product.category — a group simply
  // doesn't appear until at least one active product (house or seller) is
  // tagged into it, so this list is implicitly "which tags are active right
  // now" rather than a fixed, hardcoded menu of sections.
  function groupByCategory(products) {
    const order = [];
    const byCategory = {};
    products.forEach(function (p) {
      const key = p.category || 'Other';
      if (!byCategory[key]) { byCategory[key] = []; order.push(key); }
      byCategory[key].push(p);
    });
    return order.map(function (key) { return { category: key, items: byCategory[key] }; });
  }

  function render(products, sellers) {
    const groups = groupByCategory(products);
    contentEl.innerHTML = groups.map(function (group) {
      return '<div class="shop-group">' +
        '<div class="group-head">' +
          '<div class="group-title">' + escapeHtml(group.category) + '</div>' +
          '<div class="group-count">' + group.items.length + (group.items.length === 1 ? ' item' : ' items') + '</div>' +
        '</div>' +
        '<div class="grid">' + group.items.map(function (p) { return productCardHtml(p, sellers); }).join('') + '</div>' +
      '</div>';
    }).join('');

    contentEl.querySelectorAll('.pcard').forEach(function (card) {
      const productId = Number(card.dataset.id);
      card.querySelector('[data-action="add-to-cart"]').addEventListener('click', function (e) { addToCart(productId, e.target, card); });
      card.querySelector('[data-action="wish"]').addEventListener('click', function (e) { toggleWishlist(productId, e.target); });
    });
  }

  function productCardHtml(p, sellers) {
    const seller = sellers[p.seller_id];
    const isHouse = !!(seller && seller.is_house);
    const wished = wishlistIds.indexOf(p.id) !== -1;
    const category = p.category || 'Other';
    const tagHtml = isHouse
      ? '<span class="tag tag-green">' + escapeHtml(category) + '</span>' +
        '<span class="tag-seller">Admin Managed</span>'
      : '<span class="tag tag-red">' + escapeHtml(category) + '</span>' +
        (seller ? '<span class="tag-seller">by ' + escapeHtml(seller.store_name) + '</span>' : '');
    const mediaHtml = p.image_key
      ? '<img src="' + window.assetUrl(p.image_key) + '" alt="' + escapeHtml(p.name) + '"/>'
      : '<div class="pcard-icon" aria-hidden="true">' + iconFor(category) + '</div>';
    return '<div class="pcard" id="product-' + p.id + '" data-id="' + p.id + '">' +
      '<button class="wish-btn' + (wished ? ' on' : '') + '" data-action="wish" aria-label="Save to wishlist">' + (wished ? '&#9829;' : '&#9825;') + '</button>' +
      mediaHtml +
      '<div class="pbody">' +
        '<div class="tag-row">' + tagHtml + '</div>' +
        '<div class="pname">' + escapeHtml(p.name) + '</div>' +
        '<div class="pdesc">' + escapeHtml(p.description || '') + '</div>' +
        '<div class="prow">' +
          '<span class="pprice">' + window.formatINR(p.price) + '</span>' +
          '<button class="add-btn" data-action="add-to-cart">Add to Cart</button>' +
        '</div>' +
        '<div class="pdesc-msg" data-role="msg"></div>' +
      '</div>' +
    '</div>';
  }

  function highlightFromQuery() {
    const id = new URLSearchParams(window.location.search).get('highlight');
    if (!id) return;
    const card = document.getElementById('product-' + id);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('highlight');
    setTimeout(function () { card.classList.remove('highlight'); }, 2400);
  }

  function addToCart(productId, btn, card) {
    if (!accessToken) {
      window.location.href = './login.html';
      return;
    }
    btn.disabled = true;
    const msgEl = card.querySelector('[data-role="msg"]');
    msgEl.textContent = '';
    window.orderApiRequest('/api/cart/items', {
      method: 'POST',
      body: JSON.stringify({ productId: productId, quantity: 1 })
    }, accessToken)
      .then(function () {
        showToast('Added to cart');
        btn.disabled = false;
      })
      .catch(function (err) {
        btn.disabled = false;
        if (err && err.body && err.body.error === 'different_seller_in_cart') {
          msgEl.textContent = 'Cart has items from another seller — check out or clear it first.';
        } else {
          showToast('Could not add that item');
        }
      });
  }

  function toggleWishlist(productId, btn) {
    if (!accessToken) {
      window.location.href = './login.html';
      return;
    }
    const wished = wishlistIds.indexOf(productId) !== -1;
    btn.disabled = true;
    const request = wished
      ? window.orderApiRequest('/api/wishlist/items/' + productId, { method: 'DELETE' }, accessToken)
      : window.orderApiRequest('/api/wishlist/items', { method: 'POST', body: JSON.stringify({ productId: productId }) }, accessToken);
    request
      .then(function () {
        if (wished) {
          wishlistIds = wishlistIds.filter(function (id) { return id !== productId; });
          btn.classList.remove('on');
          btn.innerHTML = '&#9825;';
        } else {
          wishlistIds.push(productId);
          btn.classList.add('on');
          btn.innerHTML = '&#9829;';
        }
        btn.disabled = false;
      })
      .catch(function () {
        showToast('Could not update your wishlist');
        btn.disabled = false;
      });
  }
})();
</script>
</body>
</html>
