name: dumbbrew

x-service-common: &service-common
  restart: unless-stopped
  environment:
    - DATABASE_URL=${DATABASE_URL}
    - JWT_SECRET=${JWT_SECRET}
    - JWT_ISSUER=${JWT_ISSUER:-dumbbrew-auth}
    - CORS_ORIGIN=${CORS_ORIGIN:-*}
    - NODE_ENV=${NODE_ENV:-production}
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - dumbbrew-net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dumbbrew}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-dumbbrew}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dumbbrew}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dumbbrew-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    <<: *service-common
    build: ./services/auth-service
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-dumbbrew-auth}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4001
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-7}
      # Customer registration (Authentik + Supabase) — see docs/AUTHENTIK_SETUP.md
      - AUTHENTIK_URL=http://authentik-server:9000
      - AUTHENTIK_API_TOKEN=${AUTHENTIK_API_TOKEN:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - TERMS_VERSION=${TERMS_VERSION:-2026-08-30}
      # Customer login session exchange — see auth-service config.ts comment
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
    expose:
      - "4001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  content-service:
    <<: *service-common
    build: ./services/content-service
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-dumbbrew-auth}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4002
    expose:
      - "4002"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  order-service:
    <<: *service-common
    build: ./services/order-service
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4003
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-dumbbrew-auth}
      # No local Postgres dependency (see src/index.ts) — carts/orders/
      # sellers/products all live in Supabase, reached via the service-role
      # key, same as auth-service's customer registration flow.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
    # Doesn't touch the shared Postgres, so it doesn't need service-common's
    # postgres health-dependency — but *service-common still pulls one in;
    # override it to empty since this service would otherwise wait on a
    # database it never queries.
    depends_on: []
    expose:
      - "4003"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gateway:
    restart: unless-stopped
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - content-service
      - order-service
    networks:
      - dumbbrew-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - dumbbrew-net

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dumbbrew-net

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dumbbrew-net

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - dumbbrew-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - dumbbrew-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - dumbbrew-net

  # --- Authentik (customer SSO/identity) ---
  # Deliberately given its own Postgres + Redis instead of a schema in the
  # shared `postgres` container: Authentik runs its own first-party
  # migrations against its DB and expects to own it outright, unlike
  # auth-service/content-service which are our own code following the
  # schema-per-service convention.
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
      - POSTGRES_DB=authentik
    volumes:
      - authentik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dumbbrew-net

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dumbbrew-net

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10.4
    restart: unless-stopped
    command: server
    environment: &authentik-env
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
    # No domain/TLS exists yet (see infra/terraform/network.tf) so this is
    # exposed directly on its own host port rather than proxied through the
    # gateway — Authentik expects to own its origin, not live under an
    # nginx sub-path. Move behind a subdomain once DNS/TLS exist.
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - dumbbrew-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10.4
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - dumbbrew-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dumbbrew-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  authentik-postgres-data:
